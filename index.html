function modal(html,onMount,{locked=false,wide=false,onClose}={}){
  const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box${wide?" wide":""}" role="dialog" aria-modal="true">${html}</div>`;
  const prev=document.activeElement;document.body.append(m);
  const close=()=>{m.remove();onClose&&onClose();prev?.focus?.()};
  if(!locked){m.addEventListener("click",e=>{if(e.target===m)close()});m.addEventListener("keydown",e=>{if(e.key==="Escape")close()})}
  m.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  onMount&&onMount(m.querySelector(".box"),close);(m.querySelector("input,textarea,select")||m.querySelector("button"))?.focus();return close;
}

function bindRates(t,admin){

function seeded(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function shuffleIdx(n,seed){const r=seeded(String(seed)),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  if(n>1&&a.every((v,i)=>v===i))a.push(a.shift());return a}

/* rich text: **bold**, {a/b} fraction, ^() power, √() root, _() subscript, $...$ LTR math, ___ blank */
function rich(s){
  let h=esc(s||"");
  h=h.replace(/\$([^$]+)\$/g,(m,x)=>"\u0001"+x+"\u0002");
  h=h.replace(/[0-9٠-٩√∛π({a-zA-Z][0-9٠-٩\s.,+\-−×÷=≠≈≤≥±√∛π^(){}\/_%°a-zA-Z]*[0-9٠-٩)}°%πa-zA-Z]/g,m=>/[0-9٠-٩]/.test(m)&&/[+\-−×÷=≠≈≤≥±√∛^]/.test(m)?`<bdi dir="ltr" class="m">${m}</bdi>`:m);
  h=h.replace(/\u0001([^\u0002]*)\u0002/g,(m,x)=>'<bdi dir="ltr" class="m">'+x.replace(/<\/?bdi[^>]*>/g,"")+'</bdi>');
  h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  h=h.replace(/_{3,}|\.{6,}/g,'<span class="bl"></span>');
  h=h.replace(/\{\s*([^{}\/]+?)\s*\/\s*([^{}]+?)\s*\}/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  h=h.replace(/(?:√|sqrt)\(([^()]*)\)/g,'√<span class="ovl">$1</span>');
  h=h.replace(/∛\(([^()]*)\)/g,'∛<span class="ovl">$1</span>');
  h=h.replace(/\^\(([^()]*)\)/g,"<sup>$1</sup>").replace(/\^([0-9a-zA-Z٠-٩]+)/g,"<sup>$1</sup>");
  h=h.replace(/_\(([^()]*)\)/g,"<sub>$1</sub>");
  return h.replace(/\n/g,"<br>");
}
function blankText(t,key){return String(t||"").split(/\[([^\]]*)\]/).map((p,i)=>i%2?(key?`<span class="bl k">${esc(p)}</span>`:`<span class="bl" style="min-width:${Math.max(22,Math.min(60,p.length*3))}mm"></span>`):rich(p)).join("")}
const R=t=>`<bdi>${rich(t)}</bdi>`;
const linesHTML=n=>n>0?`<div class="lines">${"<div></div>".repeat(Math.min(15,n))}</div>`:"";

const MM=96/25.4,BODY_PX=262*MM;
const pagesWord=n=>n===1?"صفحة واحدة":n===2?"صفحتان":`${n} صفحات`;
let MEAS=null;
function measurer(){if(!MEAS||!document.body.contains(MEAS)){MEAS=document.createElement("div");MEAS.className="meas-host";MEAS.setAttribute("aria-hidden","true");
  MEAS.innerHTML='<div class="paper measure"><div class="pbody"></div></div>';document.body.append(MEAS)}return MEAS.firstElementChild}
function renderSheets(d,key){
  const {blocks,lg,ty}=paperParts(d,key);const m=measurer(),body=m.firstElementChild;
  m.dir=lg==="en"?"ltr":"rtl";m.lang=lg;m.style.setProperty("--tc",ty.color);body.innerHTML="";
  const pages=[[]];
  const tmp=document.createElement("div");
  for(const b of blocks){
    tmp.innerHTML=b.html;const nodes=[...tmp.childNodes];nodes.forEach(x=>body.append(x));
    const cur=pages[pages.length-1];
    if(body.offsetHeight>BODY_PX&&cur.length){
      const carry=[];while(cur.length&&cur[cur.length-1].keep)carry.unshift(cur.pop());
      if(!cur.length){cur.push(...carry);carry.length=0}
      pages.push(carry);body.innerHTML=carry.map(c=>c.html).join("")+b.html;
    }
    pages[pages.length-1].push(b);
  }
  const N=pages.length,lim=LIMIT[d.type],approved=needsApproval(d)&&d.status==="approved";
  const foot=i=>`<div class="pfoot2"><span>ابتدائية شروق المعرفة النموذجية · حيث التميز</span><span class="pg">${lg==="ar"?`صفحة ${i+1} من ${N}`:`Page ${i+1} of ${N}`}</span><span${approved?' class="ok"':""}>${approved?`✓ ${lg==="ar"?"معتمد من إدارة المدرسة":"Approved"} · ${fmtDate(d.review?.at)}`:(lg==="ar"?"العام الدراسي 2026 – 2027م":"2026 – 2027")}</span></div>`;
  const html=`<div class="sheets">${pages.map((pg,i)=>{const over=lim&&i>=lim;
    return `<div class="paper${over?" over":""}" dir="${lg==="en"?"ltr":"rtl"}" lang="${lg}" style="--tc:${ty.color}"><div class="pbody">${pg.map(b=>b.html).join("")}</div>${foot(i)}${over?`<div class="overbadge">⚠️ هذه الصفحة خارج الحد المسموح (${limitText(d.type)})</div>`:""}</div>`}).join("")}</div>`;
  body.innerHTML="";return{html,n:N};
}

function fit(w){const s=w.querySelector(".pv-scale"),p=s&&s.firstElementChild;if(!p||!w.clientWidth)return;
  const pw=p.offsetWidth,ph=p.offsetHeight,k=Math.min(1,w.clientWidth/pw);
  s.style.transform=`scale(${k})`;s.style.left=Math.max(0,(w.clientWidth-pw*k)/2)+"px";if(!w.dataset.fixed)w.style.height=Math.ceil(ph*k)+"px"}
const RO=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>fit(e.target))):{observe(){}};
function drawInto(w,d,key,onPages){const r=renderSheets(d,key);w.querySelector(".pv-scale").innerHTML=r.html;fit(w);RO.observe(w);onPages&&onPages(r.n);return r.n}

async function printDoc(d,key){

function emptyItem(t){return({mcq:{text:"",opts:["","","",""],ans:0},tf:{text:"",ans:true},blank:{text:""},match:{a:"",b:""},short:{text:"",ans:"",lines:2},essay:{text:"",ans:"",lines:6},
  order:{text:""},classify:{text:"",cat:0},math:{text:"",ans:"",space:"m"},image:{text:"",ans:"",lines:2},passage:{text:"",ans:"",lines:2}})[t]}
function defaultQ(t,lg){const cnt={mcq:3,tf:3,blank:3,match:4,short:2,essay:1,order:4,classify:4,math:2,image:2,passage:3,section:0}[t];
  const q={id:uid(),type:t,prompt:PROMPTS[t][lg],marks:t==="section"?0:({mcq:3,tf:3,blank:3,match:4,short:4,essay:5,order:2,classify:4,math:4,image:4,passage:6})[t],items:[...Array(cnt)].map(()=>emptyItem(t))};
  if(t==="classify"){q.cats=lg==="ar"?["الفئة الأولى","الفئة الثانية"]:["Group 1","Group 2"];q.items.forEach((it,i)=>it.cat=i%2)}
  if(t==="blank")q.wordBank=false;if(t==="image")q.image="";if(t==="passage")q.passage="";return q}
function newDoc(type,lang,t){
  return{id:uid(),teacher:t.id,type,lang,title:TITLES[type][lang],subject:t.subject.replace(/\s*\(.+\)/,""),grade:0,term,duration:type==="exam"?"60":type==="quiz"?"15":"",date:"",unit:"",
    instructions:INSTR[type][lang],showTeacher:true,status:"draft",review:null,useMarks:false,questions:type==="drill"||type==="ws"?[defaultQ("blank",lang),defaultQ("match",lang)]:[defaultQ("mcq",lang),defaultQ("tf",lang)],created:Date.now(),updated:Date.now()}}

/* ---------- Docs list (teacher: own; admin: all) ---------- */
let docFilter={type:"all",q:""};
const pendingCount=()=>DB.docs.filter(d=>needsApproval(d)&&d.status==="pending").length;
function docsPage(t,admin){
  const all=admin?DB.docs:DB.docs.filter(d=>d.teacher===t.id);
  const counts=Object.keys(TYPES).map(k=>[k,all.filter(d=>d.type===k).length]);
  const pend=all.filter(d=>needsApproval(d)&&d.status==="pending").length;
  if(admin&&pend&&docFilter.type==="all"&&can("approve")&&!docFilter.seen){docFilter.type="pending";docFilter.seen=true}
  return `<div class="band"><div class="wrap"><div><h1>${admin?"الاختبارات وأوراق العمل في المدرسة":"الاختبارات وأوراق العمل"}</h1>
    <p>${admin?"كل ما أنشأه المعلمون بالكليشة الموحدة للمدرسة: معاينة، واعتماد الاختبارات، وطباعة.":"أنشئ اختبارًا أو اختبارًا قصيرًا أو ورقة عمل أو مذكرة تدريبات بكليشة المدرسة الموحدة. الاختبارات تُطبع بعد اعتماد الإدارة."}</p></div>
    ${admin?"":`<button class="btn gold" id="newDoc">＋ إنشاء جديد</button>`}</div></div>
  <div class="wrap">
    <div class="stats" style="margin-top:-22px">${counts.map(([k,c])=>`<div class="stat" style="--c:var(--g${{exam:1,quiz:2,ws:3,drill:4}[k]})"><div class="n" data-count="${c}">0</div><div class="l">${TYPES[k].icon} ${TYPES[k].ar}</div></div>`).join("")}</div>
    <div class="finder"><div class="inp">${I.search}<input id="dq" type="search" placeholder="${admin?"ابحث بالعنوان أو اسم المعلم أو المادة…":"ابحث بعنوان الورقة…"}" value="${esc(docFilter.q)}" aria-label="بحث"></div></div>
    <div class="chips" role="group" aria-label="تصفية"><button class="chip" data-dt="all" aria-pressed="${docFilter.type==="all"}">الكل</button>
      <button class="chip pendchip" data-dt="pending" aria-pressed="${docFilter.type==="pending"}">⏳ بانتظار الاعتماد${pend?` (${pend})`:""}</button>
      ${Object.entries(TYPES).map(([k,v])=>`<button class="chip" data-dt="${k}" aria-pressed="${docFilter.type===k}">${v.icon} ${v.ar}</button>`).join("")}</div>
    <div class="dl-grid" id="dgrid"></div>
  </div>`;
}
function drawDocs(t,admin){
  const g=document.getElementById("dgrid");if(!g)return;const nq=norm(docFilter.q);
  const list=(admin?DB.docs:DB.docs.filter(d=>d.teacher===t.id)).filter(d=>(docFilter.type==="all"||(docFilter.type==="pending"?needsApproval(d)&&d.status==="pending":d.type===docFilter.type))&&(!nq||norm(d.title+" "+d.subject+" "+(tById(d.teacher)?.name||"")).includes(nq))).sort((a,b)=>b.updated-a.updated);
  if(!list.length){g.innerHTML=admin||docFilter.type!=="all"?`<div class="empty">${docFilter.type==="pending"?"لا توجد اختبارات بانتظار الاعتماد ✓":"لا توجد أوراق مطابقة."}</div>`:
    `<div class="empty" style="grid-column:1/-1"><div style="font-size:44px">🧾</div><p style="font-weight:700;color:var(--ink);margin:6px 0">ابدأ أول ورقة لك</p><p>اختر نوع الورقة لتبدأ مباشرة بكليشة المدرسة:</p>
      <div class="newtiles" style="max-width:640px;margin:14px auto 0;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${Object.entries(TYPES).map(([k,v])=>`<button data-quick="${k}" style="--tc:${v.color}"><span class="e">${v.icon}</span>${v.ar}</button>`).join("")}</div></div>`;
    g.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>createDoc(t,b.dataset.quick,"ar"));return}
  g.innerHTML=list.map(d=>{const ty=TYPES[d.type],tt=tById(d.teacher),cp=canPrint(d);
    const lock=cp?"":` disabled title="يتطلب اعتماد إدارة المدرسة"`;
    return `<article class="dcard" style="--tc:${ty.color}"><div class="thumb pv-wrap" data-fixed="1" data-id="${d.id}"><span class="tbadge">${ty.icon} ${ty.ar}</span><div class="pv-scale"></div></div>
      <div class="db"><div class="dtop"><h3>${esc(d.title)}</h3>${statusChip(d)}</div><div class="dm">${admin&&tt?`👤 ${esc(tt.name)}<br>`:""}${esc(d.subject)} · ${GRADES.ar[d.grade]||""} · ${d.lang==="en"?"English":"عربي"}</div>
        <div class="dm">${d.questions.filter(q=>q.type!=="section").length} أسئلة${hasMarks(d)&&totalMarks(d)?` · ${fmtNum(totalMarks(d))} درجة`:""} · آخر تعديل ${fmtDate(d.updated)}</div>
        ${!admin&&d.status==="returned"&&d.review?.note?`<div class="msg err" style="margin:8px 0 0;font-size:13px">↩ ${esc(d.review.note)}</div>`:""}</div>
      <div class="da">${admin?`<button class="btn sm" data-pv="${d.id}">${can("approve")&&needsApproval(d)&&d.status==="pending"?"مراجعة واعتماد":"معاينة"}</button>`:`<a class="btn sm" href="#doc-${d.id}">✏️ تحرير</a>`}
        <button class="btn ghost sm" data-pr="${d.id}"${lock}>${cp?"🖨️":"🔒"} طباعة</button><button class="btn ghost sm" data-prk="${d.id}"${lock}>نموذج الإجابة</button>
        ${admin?"":`<button class="btn ghost sm" data-dup="${d.id}">نسخ</button><button class="btn danger sm" data-del="${d.id}">حذف</button>`}</div></article>`}).join("");
  g.querySelectorAll(".thumb").forEach(w=>{const d=DB.docs.find(x=>x.id===w.dataset.id);drawInto(w,d,false)});
  const byId=id=>DB.docs.find(x=>x.id===id);
  g.querySelectorAll("[data-pv]").forEach(b=>b.onclick=()=>previewDoc(byId(b.dataset.pv)));
  g.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>printDoc(byId(b.dataset.pr),false));
  g.querySelectorAll("[data-prk]").forEach(b=>b.onclick=()=>printDoc(byId(b.dataset.prk),true));
  g.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{const d=JSON.parse(JSON.stringify(byId(b.dataset.dup)));d.id=uid();d.title+=" (نسخة)";d.status="draft";d.review=null;d.questions.forEach(q=>q.id=uid());d.created=d.updated=Date.now();act("doc.save",{doc:d},"✅ تم إنشاء نسخة").then(r=>r&&drawDocs(t,admin))});
  g.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const d=byId(b.dataset.del);if(!confirm(`حذف «${d.title}» نهائيًا؟`))return;
    if(!(await act("doc.delete",{id:d.id},"تم حذف الورقة")))return;for(const q of d.questions)if(q.image&&!imgInUse(q.image))api("file.delete",{id:q.image},{quiet:true}).catch(()=>{});render()});
  Promise.all(list.map(loadImgs)).then(r=>{if(r.some(Boolean))g.querySelectorAll(".thumb").forEach(w=>drawInto(w,DB.docs.find(x=>x.id===w.dataset.id),false))});
}
function bindDocs(t,admin){
  const q=document.getElementById("dq");q.addEventListener("input",()=>{docFilter.q=q.value;drawDocs(t,admin)});
  root.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>{docFilter.type=b.dataset.dt;root.querySelectorAll("[data-dt]").forEach(c=>c.setAttribute("aria-pressed",c===b));drawDocs(t,admin)});
  document.getElementById("newDoc")?.addEventListener("click",()=>newDocDialog(t));
  drawDocs(t,admin);countUp();
}
function createDoc(t,type,lang){const d=newDoc(type,lang,t);act("doc.save",{doc:d}).then(r=>{if(r)location.hash="#doc-"+d.id})}

  modal(`<h2>إنشاء ورقة جديدة</h2><p class="hint" style="margin:0 0 14px">اختر النوع ولغة الورقة. الكليشة وشعار المدرسة يُضافان تلقائيًا.</p>
    <div class="newtiles" id="nt">${Object.entries(TYPES).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===type}" style="--tc:${v.color}"><span class="e">${v.icon}</span>${v.ar}<small>${v.d}</small></button>`).join("")}</div>

function previewDoc(d){let key=false;const ap=SESSION?.type==="admin"&&can("approve")&&needsApproval(d)&&d.status==="pending";const tt=tById(d.teacher);
  modal(`<div class="vh"><h2>${esc(d.title)} ${statusChip(d)}</h2><div class="row-actions">
      ${ap?`<button class="btn sm okbtn" id="apOk">✓ اعتماد الاختبار</button><button class="btn danger sm" id="apNo">↩ إعادة للمعلم</button>`:""}
      <label class="chk"><input type="checkbox" id="pk"> نموذج الإجابة</label>
      <button class="btn ghost sm" id="pp">🖨️ طباعة / PDF</button><button class="btn ghost sm" data-close>إغلاق</button></div></div>
    <div class="pvinfo"><span>👤 ${esc(tt?.name||"")}</span><span id="pgInfo"></span>${d.review?.note?`<span>📝 ملاحظة الإدارة: ${esc(d.review.note)}</span>`:""}</div>
    <div class="pv-wrap" id="mpv"><div class="pv-scale"></div></div>`,
  (box,close)=>{const w=box.querySelector("#mpv");const info=n=>{const lim=LIMIT[d.type];box.querySelector("#pgInfo").innerHTML=`📄 ${pagesWord(n)}${lim?` (الحد: ${limitText(d.type)})`:""}${lim&&n>lim?' <b style="color:var(--danger)">— يتجاوز الحد</b>':""}`};
    const draw=()=>drawInto(w,d,key,info);draw();loadImgs(d).then(c=>c&&draw());requestAnimationFrame(()=>fit(w));
    box.querySelector("#pk").onchange=e=>{key=e.target.checked;draw()};box.querySelector("#pp").onclick=()=>printDoc(d,key);
    box.querySelector("#apOk")?.addEventListener("click",async()=>{const n=await measurePages(d,false),lim=LIMIT[d.type];
      if(lim&&n>lim&&!confirm(`الاختبار ${pagesWord(n)} ويتجاوز الحد (${limitText(d.type)}). هل تعتمده رغم ذلك؟ لن يتمكن المعلم من طباعته حتى يختصره.`))return;
      const r=await act("doc.review",{id:d.id,status:"approved"},"✅ تم اعتماد الاختبار، ويمكن للمعلم طباعته الآن");if(r){close();render()}});
    box.querySelector("#apNo")?.addEventListener("click",()=>{close();modal(`<h2>إعادة الاختبار للمعلم</h2><p class="hint" style="margin:0 0 10px">اكتب ملاحظاتك ليعدّل المعلم الاختبار ثم يعيد إرساله.</p>
      <div class="idt"><textarea id="rn" placeholder="مثال: يرجى إضافة سؤال على مهارة الكسور، وتصحيح الخيار ب في السؤال الأول."></textarea></div>
      <div class="acts" style="margin-top:12px"><button class="btn danger" id="rs">إعادة للمعلم</button><button class="btn ghost" data-close>إلغاء</button></div>`,(b2,c2)=>{
        b2.querySelector("#rs").onclick=async()=>{const note=b2.querySelector("#rn").value.trim();if(!note){toast("اكتب ملاحظة للمعلم");return}
          const r=await act("doc.review",{id:d.id,status:"returned",note},"↩ أُعيد الاختبار للمعلم مع ملاحظاتك");if(r){c2();render()}}})});
  },{wide:true});
}

function itemEd(d,q,qi,it,ii){
  const A=`data-q="${qi}" data-i="${ii}"`,lg=d.lang==="en"?"en":"ar";
  const txt=(f,ph,v=it[f])=>`<input class="bi" ${A} data-f="${f}" value="${esc(v)}" dir="auto" placeholder="${ph}">`;
  const ans=(ph="الإجابة النموذجية (تظهر في نموذج الإجابة)")=>`<input class="bi k" ${A} data-f="ans" value="${esc(it.ans)}" dir="auto" placeholder="${ph}">`;
  const lines=`<label class="ln">أسطر الإجابة<input type="number" min="0" max="15" ${A} data-f="lines" value="${it.lines}"></label>`;
  let b="";
  switch(q.type){
    case"mcq":b=txt("text","نص الفقرة")+`<div class="opts-ed">${it.opts.map((o,j)=>`<div class="opt"><input type="radio" name="a-${q.id}-${ii}" ${A} data-f="ans" value="${j}" ${it.ans===j?"checked":""} aria-label="الإجابة الصحيحة ${LET[lg][j]}" title="الإجابة الصحيحة"><span class="ol">${LET[lg][j]}</span><input class="bi" ${A} data-o="${j}" data-f="opt" value="${esc(o)}" dir="auto" placeholder="الخيار ${LET[lg][j]}">${it.opts.length>2?`<button class="ib d" data-act="delOpt" ${A} data-o="${j}" aria-label="حذف الخيار">×</button>`:"<span></span>"}</div>`).join("")}
      ${it.opts.length<6?`<button class="mini-btn" data-act="addOpt" ${A}>+ خيار</button>`:""}</div>`;break;
    case"tf":b=`<div class="row3">${txt("text","نص العبارة")}<select class="bi" ${A} data-f="ans"><option value="1" ${it.ans?"selected":""}>✓ صح</option><option value="0" ${!it.ans?"selected":""}>✗ خطأ</option></select></div>`;break;
    case"blank":b=txt("text","مثال: عاصمة المملكة العربية السعودية هي [الرياض]");break;
    case"match":b=`<div class="row2">${txt("a","العمود (أ)")}${txt("b","ما يطابقه في العمود (ب)")}</div>`;break;
    case"order":b=txt("text","العنصر رقم "+(ii+1)+" في الترتيب الصحيح");break;
    case"classify":b=`<div class="row3">${txt("text","الكلمة")}<select class="bi" ${A} data-f="cat">${(q.cats||[]).map((c,ci)=>`<option value="${ci}" ${it.cat===ci?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`;break;
    case"math":b=txt("text","نص المسألة، مثال: أوجد ناتج {3/4} + {1/4}")+`<div class="row3">${ans("الحل / الناتج")}<select class="bi" ${A} data-f="space"><option value="s" ${it.space==="s"?"selected":""}>مساحة صغيرة</option><option value="m" ${it.space==="m"?"selected":""}>مساحة متوسطة</option><option value="l" ${it.space==="l"?"selected":""}>مساحة كبيرة</option></select></div>`;break;
    default:b=txt("text",q.type==="essay"?"نص السؤال المقالي":"نص السؤال")+`<div class="row3">${ans()}${lines}</div>`;
  }
  return `<div class="it"><span class="no">${q.type==="order"?ii+1:ii+1}</span><div class="body">${b}</div>${q.items.length>1?`<button class="ib d" data-act="delItem" ${A} aria-label="حذف">×</button>`:"<span></span>"}</div>`;
}
function qcardHTML(d,q,qi,num){

function evCalc(){const fake={scores:EVDRAFT.scores};return {ds:GROUPS.map((g,gi)=>domainScore(fake,gi)),tot:totalScore(fake),miss:ALL_ITEMS.filter(it=>EVDRAFT.scores[it.k]===undefined).length}}
function evRefresh(t){
  const ev=evalOf(t.id),c=evCalc();

  document.getElementById("evbars").innerHTML=GROUPS.map((g,gi)=>`<div class="pcb" style="--ac:${AX[gi].c}"><span>${AX[gi].i} م${gi+1}</span><span class="fill"><i style="width:${c.ds[gi].score}%"></i></span><b>${c.ds[gi].score}</b></div>`).join("");
  root.querySelectorAll("[data-ds]").forEach(el=>{const d=c.ds[+el.dataset.ds];el.innerHTML=`<b>${d.score}</b>/100 <small>(${d.rated}/${d.total})</small>`});
  document.getElementById("evmiss").textContent=c.miss?`متبقٍ ${c.miss} بندًا دون تقييم`:"✓ جميع البنود مقيّمة";
  document.getElementById("evst").innerHTML=!ev?'<span class="stchip st-draft">لم يُحفظ بعد</span>':ev.status==="approved"?`<span class="stchip st-ok">✓ معتمد · ${esc(ev.approvedBy||"")}</span>`:'<span class="stchip st-pend">مسودة</span>';
  const ok=document.getElementById("evok"),un=document.getElementById("evun");if(ok)ok.hidden=ev?.status==="approved";if(un)un.hidden=ev?.status!=="approved";

async function evSave(t,quiet){
  clearTimeout(evTimer);evTimer=0;
  try{await api("eval.save",{teacher:t.id,term,scores:EVDRAFT.scores,notes:EVDRAFT.notes},{quiet});if(!quiet)toast("💾 تم حفظ التقييم");evRefresh(t);return true}
  catch(e){toast("⚠️ "+e.message);return false}
}
function bindEval(t){
  bindTermSeg();const ev=()=>evalOf(t.id);
  const schedule=()=>{if(ev()?.status==="approved")return;clearTimeout(evTimer);evTimer=setTimeout(()=>evSave(t,true),900)};
  root.querySelectorAll(".rt").forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=+b.dataset.v;EVDRAFT.scores[k]=v;
    root.querySelectorAll(`.rt[data-k="${k}"]`).forEach(x=>x.setAttribute("aria-checked",+x.dataset.v===v));evRefresh(t);schedule()});
  root.querySelectorAll("[data-n]").forEach(ta=>ta.oninput=()=>{EVDRAFT.notes[ta.dataset.n]=ta.value;schedule()});
  document.getElementById("evsave")?.addEventListener("click",()=>evSave(t,false));
  document.getElementById("sug")?.addEventListener("click",()=>{let n=0;ITEMS.forEach(it=>{const r=itemUnits(t.id,it)/itemTarget(it);const v=r>=1?4:r>=.66?3:r>=.33?2:r>0?1:0;EVDRAFT.scores[it.k]=v;n++});
    root.querySelectorAll(".rt").forEach(x=>x.setAttribute("aria-checked",EVDRAFT.scores[x.dataset.k]===+x.dataset.v));evRefresh(t);schedule();toast(`💡 اقتُرحت درجات ${n} بندًا من نسبة الإنجاز؛ راجعها وعدّلها، ثم قيّم مجال التقييمات الإدارية.`)});
  document.getElementById("evok")?.addEventListener("click",async()=>{if(!(await evSave(t,true)))return;
    if(await act("eval.approve",{id:t.id+"-"+term,approve:true},"🏅 تم اعتماد التقييم، ويظهر تقرير الإنجاز للمعلم الآن"))evRefresh(t)});
  document.getElementById("evun")?.addEventListener("click",async()=>{if(!confirm("إلغاء الاعتماد يخفي التقرير عن المعلم. متابعة؟"))return;if(await act("eval.approve",{id:t.id+"-"+term,approve:false},"تم إلغاء الاعتماد"))render()});
  evRefresh(t);
}

/* ================= Teacher achievement report (5 standards · 25 items) ================= */
function flowSheets(blocks,cls){
  const m=measurer(),body=m.firstElementChild;const oc=m.className;m.className="paper measure "+cls;m.dir="rtl";m.style.setProperty("--tc","#3A4D14");body.innerHTML="";
  const pages=[[]];
  for(const b of blocks){body.insertAdjacentHTML("beforeend",b);const cur=pages[pages.length-1];
    if(body.offsetHeight>BODY_PX&&cur.length){pages.push([]);body.innerHTML=b}
    pages[pages.length-1].push(b)}
  body.innerHTML="";m.className=oc;const N=pages.length;
  return `<div class="sheets">${pages.map((pg,i)=>`<div class="paper ${cls}" dir="rtl" style="--tc:#3A4D14"><div class="pbody">${pg.join("")}</div>${sheetFoot(i+1,N)}</div>`).join("")}</div>`;
}
const stars=v=>v===undefined||v===null?"—":`<span class="rstar">${"★".repeat(+v)}${"☆".repeat(4-v)}</span> ${(RATE.find(r=>r[0]===+v)||[,""])[1]}`;
function evStatus(t,it,tm){const fs=it.slots.flatMap(([sk])=>filesFor(t.id,it,sk,tm));const a=fs.filter(f=>f.status==="accepted").length,p=fs.filter(f=>(f.status||"pending")==="pending").length,r=fs.filter(f=>f.status==="rejected").length;
  const done=itemDone(t.id,it,tm);return `${done?"✓ مكتمل":`${itemUnits(t.id,it,tm)}/${itemTarget(it)}`}${a?` · ${a} مقبول`:""}${p?` · ${p} مراجعة`:""}${r?` · ${r} مرفوض`:""}`}
function reportHTML(t,ev,tm){setProf(t);const AD=isAdm(t);
  const ds=GROUPS.map((g,gi)=>domainScore(ev,gi).score),tot=totalScore(ev),fs=evFiles(t.id,tm),pct=termPct(t.id,tm),ring=Math.max(0,Math.min(100,tot||0));
  const B=[];
  B.push(`${letterhead()}<div class="ptitle"><span class="tp">تقرير</span><h1>${AD?"تقرير إنجاز الموظف الإداري":"تقرير إنجاز المعلم"}</h1>${ev.status!=="approved"?'<span class="stamp">مسودة — غير معتمد</span>':""}</div>
    <div class="pmeta"><div><b>${AD?"اسم الموظف":"اسم المعلم"}</b>${esc(t.name)}</div><div><b>الرقم الوظيفي</b>${t.id}</div><div><b>${AD?"العمل الحالي":"التخصص"}</b>${esc(t.subject)}</div><div><b>الفصل الدراسي</b>${TERM_NAMES[tm]}</div><div><b>العام الدراسي</b>2026 – 2027م</div></div>`);
  B.push(`<div class="rsum"><div class="rring" style="--p:${ring}"><div><b>${fmtNum(tot)}</b><small>من 100</small></div></div>
      <div class="rgrade"><small>التقدير العام</small><b>${gradeOf(tot)}</b><span>نسبة إنجاز الحقيبة: <b>${pct}٪</b> · شواهد مقبولة: <b>${fs.filter(f=>f.status==="accepted").length}</b> · بنود مقيّمة: <b>${ALL_ITEMS.filter(it=>ev.scores?.[it.k]!==undefined).length}/${ALL_ITEMS.length}</b></span></div></div>
    <table class="ptab rdom"><thead><tr><th>المعيار</th><th>الدرجة من 100</th><th>المستوى</th><th style="width:30%"></th></tr></thead>
      <tbody>${GROUPS.map((g,gi)=>`<tr><td><b>${gi+1}. ${g.title}</b></td><td><b>${ds[gi]}</b></td><td>${gradeOf(ds[gi])}</td><td><span class="rbar"><i style="width:${ds[gi]}%"></i></span></td></tr>`).join("")}
      <tr class="rtot"><td>المجموع النهائي (متوسط المعايير ${AD?"الثلاثة":"الخمسة"})</td><td>${fmtNum(tot)}</td><td>${gradeOf(tot)}</td><td></td></tr></tbody></table>`);
  GROUPS.forEach((g,gi)=>B.push(`<table class="ptab rstd"><caption><span>المعيار ${gi+1}: ${g.title}</span><span>${ds[gi]} / 100 · ${gradeOf(ds[gi])}</span></caption>
    <thead><tr><th style="width:7%">م</th><th>البند</th><th style="width:25%">${g.admin?"مصدر التقييم":"حالة الشواهد"}</th><th style="width:22%">التقدير</th><th style="width:9%">الدرجة</th></tr></thead>
    <tbody>${g.items.map(it=>{const v=ev.scores?.[it.k];return `<tr><td>${it.num}</td><td><b>${it.title}</b></td><td class="evc">${g.admin?"تقييم مباشر من الإدارة":evStatus(t,it,tm)}</td><td>${stars(v)}</td><td><b>${v===undefined?"—":v+" / 4"}</b></td></tr>`}).join("")}</tbody></table>`));
  B.push(`<div class="rnotes">${[["strengths","✦ نقاط القوة"],["improve","✦ مجالات التحسين"],["recommend","✦ التوصيات"]].map(([k,l])=>`<div><b>${l}</b><p>${esc(ev.notes?.[k]||"—")}</p></div>`).join("")}</div>`);
  B.push(`<p class="rappr">${ev.status==="approved"?`اعتُمد هذا التقرير من ${esc(ev.approvedBy||"إدارة المدرسة")} بتاريخ ${fmtDate(ev.approvedAt)}.`:"هذا التقرير مسودة ولم يُعتمد بعد."} · سلّم التقدير: 4 ممتاز · 3 جيد جدًا · 2 جيد · 1 مقبول · 0 غير متحقق.</p>

  return flowSheets(B,"rpt");
}

/* ================= Login cards (بطاقات الدخول) ================= */
/* Minimal QR encoder: byte mode, error-correction level M, versions 1–6 → SVG */
const QR=(()=>{
  const V=[null,[16,10,1],[28,16,1],[44,26,1],[64,18,2],[86,24,2],[108,16,4]];   // [data codewords, ec per block, blocks]
  const AL=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34]];
  const EXP=new Array(512),LOG=new Array(256);
  for(let i=0,x=1;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
  const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
  function rs(data,n){let g=[1];for(let i=0;i<n;i++){const ng=new Array(g.length+1).fill(0);g.forEach((c,j)=>{ng[j]^=c;ng[j+1]^=mul(c,EXP[i])});g=ng}
    const r=new Array(n).fill(0);for(const d of data){const f=d^r[0];r.shift();r.push(0);for(let j=0;j<n;j++)r[j]^=mul(g[j+1],f)}return r}
  function encode(text){
    const bytes=[...new TextEncoder().encode(text)];let ver=1;while(ver<=6&&4+8+bytes.length*8>V[ver][0]*8)ver++;if(ver>6)throw new Error("QR text too long");
    const [dc,ec,nb]=V[ver],size=ver*4+17;
    const bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
    put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));put(0,Math.min(4,dc*8-bits.length));while(bits.length%8)bits.push(0);
    const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(""),2));for(let p=0;data.length<dc;p++)data.push(p%2?0x11:0xEC);
    const bl=dc/nb,blocks=[];for(let b=0;b<nb;b++){const d=data.slice(b*bl,(b+1)*bl);blocks.push([d,rs(d,ec)])}
    const cw=[];for(let i=0;i<bl;i++)blocks.forEach(([d])=>cw.push(d[i]));for(let i=0;i<ec;i++)blocks.forEach(([,e])=>cw.push(e[i]));
    const M=[...Array(size)].map(()=>new Array(size).fill(false)),F=[...Array(size)].map(()=>new Array(size).fill(false));
    const set=(x,y,v)=>{M[y][x]=v;F[y][x]=true};
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=size||y>=size)continue;const d=Math.max(Math.abs(dx),Math.abs(dy));set(x,y,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    for(let i=0;i<size;i++){if(!F[6][i])set(i,6,i%2===0);if(!F[i][6])set(6,i,i%2===0)}
    const al=AL[ver];for(const a of al)for(const b of al){if((a===6&&b===6)||(a===6&&b===size-7)||(a===size-7&&b===6))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const fmt=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,bit=i=>((b>>>i)&1)===1;
      for(let i=0;i<=5;i++)set(8,i,bit(i));set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));for(let i=9;i<15;i++)set(14-i,8,bit(i));
      for(let i=0;i<8;i++)set(size-1-i,8,bit(i));for(let i=8;i<15;i++)set(8,size-15+i,bit(i));set(8,size-8,true)};
    fmt(0);
    let k=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-v:v;
      if(!F[y][x]&&k<cw.length*8){M[y][x]=((cw[k>>>3]>>>(7-(k&7)))&1)===1;k++}}}
    const MF=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MF[m](x,y))M[y][x]=!M[y][x]};
    const penalty=()=>{let p=0;const line=get=>{let run=1,s=0;for(let i=1;i<size;i++){if(get(i)===get(i-1)){run++;if(run===5)s+=3;else if(run>5)s++}else run=1}
        for(let i=0;i+6<size;i++){const pat=[1,0,1,1,1,0,1].every((b,j)=>get(i+j)===!!b);if(!pat)continue;
          const before=i>=4&&[1,2,3,4].every(j=>!get(i-j)),after=i+10<size&&[7,8,9,10].every(j=>!get(i+j));if(before||after)s+=40}return s};
      for(let y=0;y<size;y++)p+=line(x=>M[y][x]);for(let x=0;x<size;x++)p+=line(y=>M[y][x]);
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      let dark=0;M.forEach(r=>r.forEach(c=>dark+=c));p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){apply(m);fmt(m);const p=penalty();if(p<bp){bp=p;best=m}apply(m)}
    apply(best);fmt(best);return M;
  }
  function svg(text,color="#1F2A0A"){const M=encode(text),n=M.length,q=2;let d="";
    M.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+q} ${y+q}h1v1h-1z`}));
    return `<svg class="qr" viewBox="0 0 ${n+q*2} ${n+q*2}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="رمز QR لرابط المنصة"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="${color}"/></svg>`}
  return {encode,svg};
})();

const portalURL=()=>(typeof location!=="undefined"&&/^https?:/.test(location.protocol)&&REMOTE)?location.origin+location.pathname.replace(/index\.html$/,""):(window.CONFIG?.PORTAL_URL||"https://hoss442020-sys.github.io/shrooqteacher/");
const CARD_STAR=`<svg class="lc-pat" viewBox="0 0 80 80" aria-hidden="true"><defs><pattern id="lcP" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M20 4l4.7 11.3L36 20l-11.3 4.7L20 36l-4.7-11.3L4 20l11.3-4.7z" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="20" cy="20" r="3" fill="none" stroke="currentColor" stroke-width=".9"/></pattern></defs><rect width="80" height="80" fill="url(#lcP)"/></svg>`;

/* one card. acc = {name, role, sub, login, alt, pass, kind} */
function loginCardHTML(acc,qr){
  return `<div class="lcard lc-${acc.kind}" dir="rtl">
    <div class="lc-side">${CARD_STAR}<div class="lc-qr">${qr}</div><span class="lc-scan">امسح للدخول</span></div>
    <div class="lc-main">
      <div class="lc-top"><img src="${LOGO}" alt=""><div class="lc-tt"><b>بوابة إنجاز منسوبي المدرسة</b><small>ابتدائية شروق المعرفة النموذجية</small></div><span class="lc-tag">بطاقة دخول</span></div>
      <div class="lc-who"><h3>${esc(acc.name)}</h3><span class="lc-role">${esc(acc.role)}${acc.sub?` · ${esc(acc.sub)}`:""}</span></div>
      <div class="lc-cred">
        <div class="lc-row${acc.kind==="teacher"?" st":""}"><span class="lc-k">${acc.kind==="teacher"?"البريد الإلكتروني الرسمي (اسم الدخول)":"اسم المستخدم"}</span><span class="lc-v" dir="ltr">${esc(acc.login)}</span></div>
        ${acc.alt?`<div class="lc-row st"><span class="lc-k">أو البريد الرسمي</span><span class="lc-v sm" dir="ltr">${esc(acc.alt)}</span></div>`:""}
        <div class="lc-row"><span class="lc-k">كلمة المرور</span><span class="lc-v pw" dir="ltr">${acc.pass?esc(acc.pass):'<span dir="rtl" class="lc-own">كلمة المرور الخاصة بك</span>'}</span></div>
      </div>
      <div class="lc-foot"><span class="lc-tab">${acc.kind==="teacher"?"تبويب: معلم / إداري":"تبويب: إدارة"}</span><span>${acc.pass?"🔒 غيّر كلمة المرور عند أول دخول":"🔒 لا تشارك كلمة المرور"}</span></div>
      <div class="lc-url" dir="ltr">${esc(portalURL().replace(/^https?:\/\//,""))}</div>
    </div></div>`;
}
function cardAccounts(which){
  const out=[];
  if(which!=="teachers")(DB.staff||[]).filter(a=>a.active!==false).forEach(a=>out.push({kind:a.role==="owner"?"owner":"staff",name:a.name,role:a.title||(a.role==="owner"?"مسؤول المنصة":"حساب إدارة"),
    login:a.user,alt:a.email||"",pass:a.role==="owner"?"":a.must?(a.initDefault?DEFAULT_PASS:a.id==="admin"?"admin123":a.id==="principal"?"principal123":""):""}));
  (Array.isArray(which)?which:[...DB.teachers].sort((a,b)=>a.name.localeCompare(b.name,"ar"))).filter(t=>t.active!==false).forEach(t=>out.push({kind:"teacher",name:t.name,role:roleWord(t),sub:t.subject,login:t.email||t.user,pass:t.must?DEFAULT_PASS:""}));
  return out;
}
function loginCardsSheets(list){
  const qr=QR.svg(portalURL()),per=8,pages=[];for(let i=0;i<list.length;i+=per)pages.push(list.slice(i,i+per));
  return `<div class="sheets">${pages.map(pg=>`<div class="paper lcpaper" dir="rtl"><div class="lc-grid">${pg.map(a=>loginCardHTML(a,qr)).join("")}</div></div>`).join("")}</div>`;
}
function printLoginCards(list,title){
  if(!list.length){toast("لا توجد حسابات نشطة للطباعة");return}
  const pr=document.getElementById("print-root");pr.innerHTML=loginCardsSheets(list);
  imgsReady(pr).then(()=>{document.title=title||"بطاقات الدخول";window.print()});
}

/* ---------- Router ---------- */
let current="";
function noPerms(){return `<div class="wrap"><div class="empty" style="padding:70px 20px"><div style="font-size:46px">🔐</div><p style="font-weight:700;color:var(--ink)">لم تُمنح لهذا الحساب صلاحيات بعد</p><p>تواصل مع مسؤول المنصة لتحديد صلاحياتك.</p></div></div>`}
function render(){
  if(!TOKEN||!SESSION){renderLogin();current="";return}
  const acc=me(),h=location.hash.slice(1);
  if(h!==current)flushDoc();
  EDIT=null;
  if(SESSION.type==="teacher"){setProf(acc);
    const dd=h.startsWith("doc-")&&DB.docs.find(x=>x.id===h.slice(4)&&x.teacher===acc.id);
    if(dd){shell(editorPage(dd));bindEditor(dd)}
    else if(h==="builder"){shell(docsPage(acc,false));bindDocs(acc,false)}
    else if(h==="circulars"){shell(circularsPage("circ"));bindCirculars("circ")}
    else if(h==="tables"){shell(circularsPage("tables"));bindCirculars("tables")}
    else if(h==="report"){shell(reportPage(acc,false));bindReport(acc,false)}
    else if(h==="perfs"){shell(teacherPerfPage(acc));bindTeacherPerf(acc)}
    else{if(h!=="my")history.replaceState(null,"","#my");shell(teacherPage(acc,false));bindTeacher(acc,false)}
  }else{
    setProf(null);
    const ok=adminPages().map(x=>x[0]);
    const t=h.startsWith("t-")&&can("teachers")&&tById(h.slice(2));
    const et=h.startsWith("eval-")&&(can("evaluate")||can("approveEval"))&&tById(h.slice(5));
    const rt=h.startsWith("report-")&&(can("reports")||can("evaluate")||can("approveEval"))&&tById(h.slice(7));
    const pvw=can("perform")||can("reports");
    const pn=h.startsWith("perf-new-")&&can("perform")&&tById(h.slice(9));
    const pe=!pn&&h.startsWith("perf-")&&pvw&&(DB.perfs||[]).find(x=>x.id===h.slice(5));
    if(pn){shell(perfFormPage({},pn));bindPerfForm({},pn)}
    else if(pe&&tById(pe.teacher)){const tt=tById(pe.teacher);shell(perfFormPage(pe,tt));bindPerfForm(pe,tt)}
    else if(t){setProf(t);shell(teacherPage(t,true));bindTeacher(t,true)}
    else if(et){setProf(et);shell(evalPage(et));bindEval(et)}
    else if(rt){setProf(rt);shell(reportPage(rt,true));bindReport(rt,true)}
    else if(ok.includes(h)){
      const P={teachers:[adminTeachers,bindTeachers],dashboard:[adminDash,bindTermSeg],review:[reviewPage,bindReview],evaluation:[evaluationPage,bindEvaluation],
        tests:[()=>docsPage(null,true),()=>bindDocs(null,true)],circulars:[()=>circularsPage("circ"),()=>bindCirculars("circ")],tables:[()=>circularsPage("tables"),()=>bindCirculars("tables")],settings:[settingsPage,bindSettings],perf:[perfListPage,bindPerfList],accounts:[adminAccounts,bindAccounts]}[h];
      shell(P[0]());P[1]();
    }
    else if(ok.length){history.replaceState(null,"","#"+ok[0]);render();return}
    else shell(noPerms());
  }
  if(acc.must&&!document.querySelector(".modal"))changePassword(true);
  if(h!==current)window.scrollTo(0,0);current=location.hash.slice(1);
}
window.addEventListener("hashchange",render);
async function boot(){
  if(!TOKEN){render();return}
  root.innerHTML=`<div class="boot"><img src="${LOGO}" alt=""><p>جارٍ تحميل البوابة…</p></div>`;
  try{const r=await api("bootstrap",{},{quiet:true});setSnapshot(r)}catch(e){clearLogin()}
  render();
}
boot();

</script>
</body>
