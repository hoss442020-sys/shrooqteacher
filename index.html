<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة إنجاز منسوبي المدرسة – ابتدائية شروق المعرفة النموذجية</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --green:#3A4D14; --green-2:#55701F; --green-deep:#1F2A0A; --gold:#C9A227; --gold-2:#E3C35A; --gold-soft:#FBF3D9;
  --bg:#F2F4EC; --surface:#FFFFFF; --surface-2:#EEF1E4; --ink:#151A0A; --muted:#565E45; --line:#D5DBC3;
  --done:#1E8E3E; --danger:#C62828;
  --g1:#55701F; --g2:#0F7C76; --g3:#B07D12; --g4:#6A3FA0;
  --shadow:0 18px 40px -18px rgba(31,42,10,.45);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --green:#8FB040; --green-2:#A9C95A; --green-deep:#10160A; --gold:#E3C35A; --gold-2:#F0D77E; --gold-soft:#332C12;
  --bg:#0E120A; --surface:#191F11; --surface-2:#222A17; --ink:#EEF2E3; --muted:#A8B192; --line:#33402A;
  --done:#5CD27A; --danger:#FF8A80; --g1:#A9C95A; --g2:#4FD1C5; --g3:#F0C24B; --g4:#B794F4;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --green:#8FB040; --green-2:#A9C95A; --green-deep:#10160A; --gold:#E3C35A; --gold-2:#F0D77E; --gold-soft:#332C12;
  --bg:#0E120A; --surface:#191F11; --surface-2:#222A17; --ink:#EEF2E3; --muted:#A8B192; --line:#33402A;
  --done:#5CD27A; --danger:#FF8A80; --g1:#A9C95A; --g2:#4FD1C5; --g3:#F0C24B; --g4:#B794F4;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.75;min-height:100vh;display:flex;flex-direction:column}
#root{flex:1}
h1,h2,h3{font-family:"Noto Kufi Arabic","Noto Sans Arabic",Tahoma,sans-serif;line-height:1.45;margin:0;font-weight:700}
a{color:var(--green-2)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Login ===== */
.lg{min-height:100%;color:#fff;background:
  radial-gradient(1000px 500px at 85% -10%,rgba(201,162,39,.35),transparent 60%),
  radial-gradient(800px 600px at 0% 110%,rgba(85,112,31,.55),transparent 60%),
  linear-gradient(135deg,#1F2A0A 0%,#33461A 55%,#22300C 100%);position:relative;overflow:hidden}
.lg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(227,195,90,.06) 0 2px,transparent 2px 26px);pointer-events:none}
.lg > *{position:relative}
.lg-top{display:flex;align-items:center;gap:14px;padding-top:22px;padding-bottom:10px}
.lg-top .logo{background:#fff;border-radius:14px;padding:6px 10px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.lg-top .logo img{width:62px}
.lg-top b{display:block;font-family:"Noto Kufi Arabic",sans-serif;font-size:18px}
.lg-top small{color:var(--gold-2);font-size:13.5px}
.lg-top .yr{margin-inline-start:auto;font-size:14px;border:1px solid rgba(227,195,90,.5);color:var(--gold-2);padding:5px 14px;border-radius:30px}
.lg-body{display:grid;grid-template-columns:1.25fr 1fr;gap:44px;align-items:center;padding-top:30px;padding-bottom:56px}
.lg-intro h1{font-size:clamp(32px,4.6vw,54px);font-weight:800;line-height:1.3}
.lg-intro .bar{width:90px;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--gold-2),var(--gold));margin:16px 0}
.lg-intro p{font-size:18px;color:#E4EAD3;max-width:56ch;margin:0}
.photo{margin:26px 0 0;border-radius:20px;overflow:hidden;border:4px solid rgba(255,255,255,.95);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);position:relative;max-width:700px;background:#fff}
.photo img{display:block;width:100%;height:auto}
.photo figcaption{position:absolute;bottom:0;inset-inline:0;padding:22px 16px 10px;background:linear-gradient(to top,rgba(20,28,6,.85),transparent);font-size:14px;display:flex;justify-content:space-between;gap:10px}
.photo figcaption span:last-child{color:var(--gold-2);font-family:"Noto Kufi Arabic",sans-serif}
.facts3{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.facts3 div{font-size:14px;color:#D8E0C3}
.facts3 b{display:block;font-family:"Noto Kufi Arabic",sans-serif;font-size:26px;color:#fff;line-height:1.3}
.lg-card{background:var(--surface);color:var(--ink);border-radius:24px;padding:32px 28px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);border-top:6px solid var(--gold)}
.lg-card h2{font-size:26px;color:var(--green)}
.lg-card .sub{color:var(--muted);margin:2px 0 20px;font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:5px;gap:5px;margin-bottom:20px}
.seg button{border:0;background:none;padding:10px;border-radius:10px;cursor:pointer;font-weight:700;font-family:"Noto Kufi Arabic",sans-serif;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff;box-shadow:0 6px 14px -6px rgba(31,42,10,.6)}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.inp{position:relative}
.inp .ic{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:14px;color:var(--muted)}
.inp input,.inp select{width:100%;padding:13px 46px 13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;transition:border-color .2s,box-shadow .2s}
.inp input:focus,.inp select:focus{border-color:var(--green-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--green-2) 18%,transparent);outline:none}
.inp .eye .ic{position:static;transform:none}
.inp:has(.eye) input{padding-left:44px}
.inp .eye{position:absolute;display:grid;top:50%;transform:translateY(-50%);inset-inline-end:8px;border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:2px solid var(--green);background:var(--green);color:#fff;text-decoration:none;font-weight:700;cursor:pointer;font-size:15px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn.block{width:100%;padding:14px;font-size:17px;font-family:"Noto Kufi Arabic",sans-serif}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1F2A0A}
.btn.ghost{background:transparent;color:var(--green)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-width:1.5px}
.msg{border-radius:12px;padding:11px 14px;font-size:14.5px;margin:0 0 14px;border:1.5px solid var(--line);background:var(--surface-2)}
.msg.err{border-color:var(--danger);color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,var(--surface))}
.msg.ok{border-color:var(--done);background:color-mix(in srgb,var(--done) 8%,var(--surface))}
.demo{margin-top:18px;border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.demo b{font-family:"Noto Kufi Arabic",sans-serif}
.demo table{width:100%;border-collapse:collapse;margin-top:6px}
.demo td{padding:3px 0}
.demo code{direction:ltr;display:inline-block;background:var(--surface);border:1px solid var(--line);padding:0 8px;border-radius:6px;font-family:Consolas,monospace;font-size:14px;cursor:pointer}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ===== App ===== */
header.top{background:linear-gradient(90deg,#1F2A0A,#3A4D14);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.18)}
body.app::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1F2A0A}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand .logo{background:#fff;border-radius:10px;padding:4px 7px;display:grid}
.brand img{width:50px}
.brand b{display:block;font-family:"Noto Kufi Arabic",sans-serif;font-size:16px}
.brand small{color:var(--gold-2);font-size:12.5px}
nav.main{margin-inline-start:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav.main a{padding:7px 14px;border-radius:10px;text-decoration:none;color:rgba(255,255,255,.85);font-weight:600;font-size:15px}
nav.main a:hover{background:rgba(255,255,255,.12)}
nav.main a[aria-current="page"]{background:var(--gold);color:#1F2A0A}
.who{display:flex;align-items:center;gap:8px;font-size:14px;padding-inline-start:12px;margin-inline-start:6px;border-inline-start:1px solid rgba(255,255,255,.25)}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#1F2A0A;display:grid;place-items:center;font-weight:800;font-family:"Noto Kufi Arabic",sans-serif}
.who button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}

.band{background:linear-gradient(120deg,#2B3A10 0%,#55701F 70%,#7C8F2E 100%);color:#fff;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 24px)}
.band .wrap{position:relative;z-index:1;padding-top:30px;padding-bottom:30px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.band h1{font-size:clamp(24px,3.6vw,34px)}
.band p{margin:4px 0 0;color:#E4EAD3}
.band .today{font-size:14px;color:var(--gold-2);text-align:end}
.band .ring span{color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:-26px 0 24px;position:relative;z-index:2}
.stat{background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);border-bottom:5px solid var(--c,var(--green))}
.stat .n{font-family:"Noto Kufi Arabic",sans-serif;font-size:32px;font-weight:800;color:var(--c);line-height:1.3}
.stat .l{font-size:14px;color:var(--muted);font-weight:600}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}

.finder{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.finder .inp{flex:1 1 300px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:16px 0 40px}
.tcard{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--surface);border-radius:18px;padding:18px;border:1px solid var(--line);transition:transform .2s,box-shadow .2s;overflow:hidden}
.tcard::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;height:5px;background:var(--sc,var(--green-2))}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tcard .top-row{display:flex;align-items:center;gap:12px}
.tcard .av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 16%,var(--surface));border:2px solid color-mix(in srgb,var(--sc) 45%,transparent);font-size:24px;flex:none}
.tcard .subj{font-size:13px;color:var(--sc);font-weight:700}
.tcard h3{font-family:"Noto Sans Arabic",sans-serif;font-size:16px;font-weight:700;line-height:1.5}
.tcard .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:12px;margin-bottom:6px}
.tcard .meta b{color:var(--ink)}
.fill{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.fill i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--green-2));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.tcard.complete .fill i{background:var(--done)}
.badge{position:absolute;top:14px;inset-inline-end:14px;font-size:12px;padding:1px 10px;border-radius:12px;font-weight:700}
.badge.ok{background:var(--done);color:#fff}
.badge.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}

/* Teacher page */
.back{display:inline-flex;align-items:center;gap:4px;color:#fff;text-decoration:none;font-weight:700;margin-bottom:6px;opacity:.9}
.ring{--p:0;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold-2) calc(var(--p)*1%),rgba(255,255,255,.2) 0);transition:--p 1.1s ease-out;flex:none}
@property --p{syntax:"<number>";inherits:false;initial-value:0}
.ring span{width:102px;height:102px;border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;font-family:"Noto Kufi Arabic",sans-serif;font-size:27px;font-weight:800}
.ring span small{display:block;font-size:12px;font-weight:600;color:var(--muted);font-family:"Noto Sans Arabic",sans-serif}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.facts span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:2px 12px;border-radius:20px;font-size:14px}
.milestone{margin-top:12px;font-weight:700;color:var(--gold-2)}
.terms{display:flex;gap:6px;margin:24px 0 4px;border-bottom:2px solid var(--line)}
.terms button{border:0;background:none;padding:10px 18px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;font-family:"Noto Kufi Arabic",sans-serif;font-size:15px}
.terms button[aria-selected="true"]{color:var(--green);border-color:var(--gold)}
.terms button:disabled{cursor:not-allowed;opacity:.55}
.hint{color:var(--muted);font-size:14px;margin:14px 0 0}
.group{margin:28px 0;--c:var(--g1)}
.group:nth-of-type(2){--c:var(--g2)}.group:nth-of-type(3){--c:var(--g3)}.group:nth-of-type(4){--c:var(--g4)}
.group h2{font-size:20px;color:var(--c);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.group h2::before{content:"";width:10px;height:28px;border-radius:4px;background:var(--c)}
.group h2 small{font-family:"Noto Sans Arabic",sans-serif;font-size:14px;color:var(--muted);font-weight:500}
.group h2 .gp{margin-inline-start:auto;font-size:13px;font-family:"Noto Sans Arabic",sans-serif;background:var(--c);color:#fff;padding:1px 12px;border-radius:14px}
.items{list-style:none;margin:12px 0 0;padding:0;border-radius:18px;background:var(--surface);overflow:hidden;box-shadow:0 8px 24px -16px rgba(31,42,10,.35);border:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:15px 16px;border-top:1px solid var(--line);border-inline-start:4px solid transparent;transition:background .3s}
.item:first-child{border-top:0}
.item.has{border-inline-start-color:var(--c)}
.item.flash{background:var(--gold-soft)}
.item .ico{font-size:22px;width:44px;height:44px;display:grid;place-items:center;background:var(--surface-2);border-radius:12px}
.item.has .ico{background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.item b{font-weight:700}
.item p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.tag{font-size:11px;background:var(--gold-soft);border:1px solid var(--gold);padding:0 8px;border-radius:10px;margin-inline-start:6px;font-weight:600;vertical-align:middle}
.status{display:flex;gap:8px;align-items:center}
.links{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.links:empty{display:none}
.links li{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface-2);border-radius:10px;padding:6px 10px;min-width:0;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.links a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;font-weight:700}
.links time{color:var(--muted);font-size:12px;white-space:nowrap}
.links button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.links button:hover{color:var(--danger)}
.count{font-size:13px;padding:4px 12px;border-radius:14px;white-space:nowrap;background:var(--surface-2);color:var(--muted);font-weight:600}
.count.ok{background:var(--done);color:#fff}
.add{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:8px;margin-top:10px}
.add input{padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.add input:focus{border-color:var(--green-2);outline:none}
.add .err{grid-column:1/-1;color:var(--danger);font-size:13px;margin:0}
.addbtn{border:2px dashed var(--green-2);background:none;color:var(--green-2);padding:6px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}
.addbtn:hover{background:var(--gold-soft)}

/* Admin */
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-bottom:24px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 8px 24px -18px rgba(31,42,10,.35)}
.card h2{font-size:18px;color:var(--green);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
.t th,.t td{padding:10px 12px;text-align:start;border-top:1px solid var(--line);vertical-align:middle}
.t thead th{border-top:0;font-weight:700;font-size:13.5px;color:var(--muted);background:var(--surface-2)}
.t td .fill{width:110px;display:inline-block;vertical-align:middle;margin-inline-end:8px}
.t code{direction:ltr;display:inline-block;font-family:Consolas,monospace;background:var(--surface-2);padding:0 8px;border-radius:6px}
.pill{font-size:12px;padding:1px 10px;border-radius:12px;font-weight:700;white-space:nowrap}
.pill.on{background:color-mix(in srgb,var(--done) 15%,var(--surface));color:var(--done)}
.pill.off{background:var(--surface-2);color:var(--muted)}
.pill.warn{background:var(--gold-soft);color:#8A6A00}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(140px,240px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed .av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);font-weight:800;color:#1F2A0A;font-family:"Noto Kufi Arabic",sans-serif}
.feed small{color:var(--muted);display:block}
.honor{list-style:none;margin:0;padding:0}
.honor li{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;border-top:1px solid var(--line)}
.honor li:first-child{border-top:0}
.honor .medal{font-size:22px}
.honor .pc{margin-inline-start:auto;font-weight:800;color:var(--green-2)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,20,6,.6);display:grid;place-items:center;z-index:40;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .box{background:var(--surface);border-radius:20px;padding:24px;width:100%;max-width:440px;box-shadow:var(--shadow);border-top:6px solid var(--gold);max-height:90vh;overflow:auto}
.modal h2{font-size:21px;color:var(--green);margin-bottom:6px}
.modal .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:8px}

@media (max-width:860px){.lg-body{grid-template-columns:1fr;gap:30px}.lg-card{order:-1}}
@media (max-width:620px){
  .lg-top .yr{display:none}
  .item{grid-template-columns:auto 1fr}.status{grid-column:1/-1}
  .add{grid-template-columns:1fr}
  .bar{grid-template-columns:1fr 44px}.bar .fill{grid-column:1/-1;grid-row:2}
  .who .nm{display:none}
  .band .ring{width:100px;height:100px}.band .ring span{width:80px;height:80px;font-size:21px}
}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%) translateY(30px);background:#1F2A0A;color:#fff;padding:12px 20px;border-radius:14px;box-shadow:var(--shadow);opacity:0;transition:.35s;z-index:50;font-weight:700;max-width:90vw;border-bottom:3px solid var(--gold)}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
footer{padding:14px 0 16px;font-size:14px;background:#1F2A0A;color:#C9D1B3}
footer .credit{text-align:center;direction:ltr;letter-spacing:.03em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== v2 additions ===== */
.strip{background:var(--surface);border-bottom:1px solid var(--line)}
.strip .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none;align-items:center}
.strip .wrap::-webkit-scrollbar{display:none}
.strip .lbl{flex:none;font-size:13px;color:var(--muted);font-weight:700;margin-inline-end:4px}
.strip button{flex:none;display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:30px;padding:5px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--green);transition:border-color .2s,background .2s,transform .2s}
.strip button:hover{border-color:var(--gold);background:var(--gold-soft);transform:translateY(-1px)}

.prof{display:flex;gap:22px;align-items:center;min-width:0}
.photo-up{position:relative;width:108px;height:108px;border-radius:50%;border:4px solid var(--gold-2);background:rgba(255,255,255,.14);display:grid;place-items:center;overflow:hidden;flex:none;font-size:44px;color:#fff;box-shadow:0 10px 26px -10px rgba(0,0,0,.5)}
label.photo-up{cursor:pointer}
.photo-up img{width:100%;height:100%;object-fit:cover}
.photo-up .cam{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.6);font-size:12px;text-align:center;padding:3px 0 5px;font-weight:700}
.photo-up input{position:absolute;width:1px;height:1px;opacity:0}
.photo-up:focus-within{outline:3px solid var(--gold);outline-offset:3px}
.facts button{background:none;border:0;color:var(--gold-2);cursor:pointer;font-weight:700;padding:0 4px;font-size:13px}
.band .tagline{color:var(--gold-2);font-weight:700;font-size:14px}

.terms button .tp{font-size:12px;background:var(--surface-2);border-radius:10px;padding:0 8px;margin-inline-start:8px;color:var(--muted);font-family:"Noto Sans Arabic",sans-serif}
.terms button[aria-selected="true"] .tp{background:var(--gold);color:#1F2A0A}
.guide{display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:14px;padding:12px 16px;margin:18px 0 6px;font-weight:600;font-size:15px}
.guide .gi{font-size:24px;flex:none}

.itm{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:18px;align-items:start;box-shadow:0 8px 24px -18px rgba(31,42,10,.35);transition:border-color .3s}
.itm + .itm{margin-top:12px}
.itm.done{border-inline-start-color:var(--c)}
.itm .hd{display:flex;gap:12px;align-items:flex-start}
.itm .num{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);border:2px solid var(--c);display:grid;place-items:center;font-weight:800;font-family:"Noto Kufi Arabic",sans-serif;flex:none;font-size:15px}
.itm.done .num{background:var(--c);color:#fff}
.itm h3{font-family:"Noto Sans Arabic",sans-serif;font-size:17px;font-weight:700;line-height:1.55}
.itm p{margin:3px 0 0;color:var(--muted);font-size:14px}
.itm .st{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipx{unicode-bidi:isolate;font-size:12px;font-weight:700;padding:1px 10px;border-radius:12px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chipx.ok{background:var(--done);color:#fff;border-color:var(--done)}
.chipx.yr{background:var(--gold-soft);color:#7A5E00;border-color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px}
.slot{position:relative;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;background:var(--surface-2);transition:border-color .2s,background .2s,transform .2s;min-width:0}
.slot.full{border-style:solid;border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.slot.drag{border-color:var(--gold);background:var(--gold-soft);transform:scale(1.02)}
.slot.busy{opacity:.7;pointer-events:none}
.slot-h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
.slot-h b{font-weight:700;line-height:1.5}
.tgt{font-size:12px;font-weight:800;padding:0 9px;border-radius:10px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;direction:ltr}
.slot.full .tgt{background:var(--c);color:#fff;border-color:var(--c)}
.files{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.files:empty{display:none}
.files li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 6px;min-width:0;animation:pop .35s ease-out}
.files li.old{animation:none}
.files .th{width:36px;height:36px;border-radius:8px;flex:none;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;letter-spacing:.02em}
.files .th.pdf{background:#C62828}
.files .th.lnk{background:var(--g2);font-size:16px}
.files .fn{flex:1;min-width:0;border:0;background:none;text-align:start;cursor:pointer;padding:0;font-size:13px;font-weight:700;color:var(--ink);line-height:1.45}
.files .fn span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fn small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.files .fn:hover span{color:var(--green-2);text-decoration:underline}
.files .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:19px;line-height:1;padding:2px 6px;border-radius:6px;flex:none}
.files .x:hover{color:var(--danger)}
.slot-acts{display:flex;gap:6px;margin-top:8px}
.up{position:relative;flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;border:1.5px solid var(--green-2);color:var(--green-2);background:var(--surface);border-radius:10px;padding:5px 8px;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.up:hover{background:var(--green-2);color:#fff}
.up:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.up input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.lk{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.lk:hover{border-color:var(--g2);color:var(--g2)}
.slot .none{font-size:12.5px;color:var(--muted);margin:8px 0 0}
@media (max-width:900px){.itm{grid-template-columns:1fr}}

.modal .box.wide{max-width:920px}
.modal .box.wide .vh{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.modal .box.wide .vh h2{font-size:17px;overflow-wrap:anywhere}
.viewer iframe{width:100%;height:72vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.viewer img{max-width:100%;max-height:72vh;display:block;margin:auto;border-radius:12px}
.idt .lg-logo{background:#fff;border-radius:16px;padding:14px;display:grid;place-items:center;margin-bottom:14px;border:1px solid var(--line)}
.idt .lg-logo img{width:160px}
.idt .txt{white-space:pre-line;font-size:16.5px;line-height:1.9}
.idt .motto{font-family:"Noto Kufi Arabic",sans-serif;font-size:24px;color:var(--green);text-align:center}
.idt textarea{width:100%;min-height:150px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;resize:vertical}
.idt textarea:focus{border-color:var(--green-2);outline:none}
.idt .slot{--c:var(--g2);margin-top:14px}
.note{font-size:13px;color:#7A5E00;background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:6px 10px;margin:10px 0}
.tcard .tt{display:flex;gap:6px;margin-top:4px}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.mini + .mini{margin-top:6px}
.band .seg2{display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:4px;gap:4px}
.band .seg2 button{border:0;background:none;color:#fff;padding:6px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-family:"Noto Kufi Arabic",sans-serif;font-size:14px}
.band .seg2 button[aria-pressed="true"]{background:var(--gold);color:#1F2A0A}
@media (max-width:620px){
  .prof{flex-direction:column;align-items:flex-start;gap:14px}
  .photo-up{width:88px;height:88px}
}
/* ===== Builder ===== */
#print-root{display:none}
.bd-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0 12px}
.bd-top .ttl{flex:1 1 260px;min-width:0;font-size:21px;font-family:"Noto Kufi Arabic",sans-serif;font-weight:700;border:2px solid transparent;border-radius:12px;padding:6px 12px;background:transparent;color:var(--ink)}
.bd-top .ttl:hover,.bd-top .ttl:focus{border-color:var(--line);background:var(--surface);outline:none}
.saved{font-size:13px;color:var(--muted);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--green-2)}
.keysw{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px}
.bd-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start;padding-bottom:40px}
.bd-prev{position:sticky;top:84px}
.pv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--muted);font-size:14px}
.pv-wrap{position:relative;overflow:hidden;border-radius:14px;background:#D5D9C8;min-height:120px}
.pv-scale{position:absolute;top:0;left:0;transform-origin:top left}
.symbar{position:sticky;top:80px;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);margin-bottom:14px}
.symtabs{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.symtabs button{border:0;background:var(--surface-2);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.symtabs button[aria-pressed="true"]{background:var(--green);color:#fff}
.syms{display:flex;flex-wrap:wrap;gap:4px;max-height:80px;overflow:auto}
.syms button{min-width:34px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:16px;padding:0 7px;color:var(--ink)}
.syms button:hover{border-color:var(--gold);background:var(--gold-soft)}
.syms button.w{font-size:12.5px;font-weight:700}
.symbar code,.hintx code{direction:ltr;unicode-bidi:isolate;background:var(--surface-2);border-radius:5px;padding:0 5px;font-size:12px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.bcard h3,.addq h3{font-size:16px;color:var(--green);margin-bottom:10px}
.tseg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tseg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.tseg button[aria-pressed="true"]{background:var(--tc,var(--green));border-color:var(--tc,var(--green));color:#fff}
.tseg.lang button[aria-pressed="true"]{background:var(--green-2);border-color:var(--green-2)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bf{display:block;font-size:13px;font-weight:700}
.bf input,.bf select,.bf textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;font-size:15px;font-weight:400;margin-top:4px}
.bf textarea{min-height:76px;resize:vertical}
.bi{width:100%;min-width:0;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;font-size:15px}
textarea.bi{resize:vertical;margin-top:8px}
.bi.k{border-style:dashed;border-color:color-mix(in srgb,var(--done) 45%,var(--line))}
.bi:focus,.bf input:focus,.bf select:focus,.bf textarea:focus{border-color:var(--green-2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--green-2) 16%,transparent)}
.inf-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px}
.inf-foot b{font-size:18px;color:var(--green)}
.qc{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--green-2);border-radius:16px;padding:14px;margin-bottom:12px;animation:pop .3s ease-out}
.qc-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qc-h .qt{font-weight:800;font-family:"Noto Kufi Arabic",sans-serif;color:var(--green);font-size:15px}
.qc-h .qn{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface-2);border-radius:10px;padding:0 10px}
.qc-h .mk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-inline-start:auto}
.qc-h .mk input{width:70px;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font:inherit}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:30px;height:30px;cursor:pointer;font-size:13px;color:var(--muted);flex:none}
.ib:hover:not(:disabled){border-color:var(--green-2);color:var(--green-2)}
.ib.d:hover{border-color:var(--danger)!important;color:var(--danger)!important}
.ib:disabled{opacity:.35;cursor:default}
.items{margin-top:6px}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 0;border-top:1px dashed var(--line)}
.it .no{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:7px;color:var(--green)}
.it .body{display:grid;gap:6px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row3{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:6px;align-items:center}
.ln{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.ln input{width:56px;padding:6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font:inherit}
.opts-ed{display:grid;gap:5px;padding-inline-start:8px}
.opt{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px;align-items:center}
.opt .ol{font-weight:800;color:var(--green);width:20px;text-align:center}
.opt input[type=radio]{width:18px;height:18px;accent-color:var(--done);cursor:pointer}
.mini-btn{border:1.5px dashed var(--green-2);background:none;color:var(--green-2);border-radius:8px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer;justify-self:start;margin-top:6px}
.mini-btn:hover{background:var(--gold-soft)}
.hintx{font-size:12.5px;color:var(--muted);margin:6px 0}
.cats{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.cats .cat{display:flex;gap:4px;align-items:center}
.cats .cat .bi{width:150px}
.imgup{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.imgup img{height:70px;border-radius:8px;border:1px solid var(--line)}
.imgup .up{flex:none}
.addq{background:var(--surface);border:2px dashed var(--gold);border-radius:16px;padding:14px}
.qtypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.qtypes button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:13.5px;text-align:start;transition:transform .15s,border-color .15s,background .15s}
.qtypes button:hover{border-color:var(--green-2);background:var(--gold-soft);transform:translateY(-1px)}
.qtypes .e{font-size:20px}
.mtabs{display:none}
@media (max-width:1020px){
  .bd-grid{grid-template-columns:1fr}.bd-prev{position:static}
  .mtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;margin-bottom:12px}
  .mtabs button{border:0;background:none;padding:8px;border-radius:9px;font-weight:700;cursor:pointer}
  .mtabs button[aria-pressed="true"]{background:var(--green);color:#fff}
  .bd-grid[data-view="edit"] .bd-prev{display:none}.bd-grid[data-view="prev"] .bd-edit{display:none}
  .symbar{top:70px}
}
@media (max-width:620px){.row2,.row3{grid-template-columns:1fr}.qc-h .mk{margin-inline-start:0}.symbar{position:static}.syms{max-height:116px}}
/* docs list */
.dl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:16px 0 40px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;border-top:5px solid var(--tc)}
.dcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.dcard .thumb{height:170px;border-radius:0;border-bottom:1px solid var(--line)}
.dcard .tbadge{position:absolute;top:10px;inset-inline-start:10px;background:var(--tc);color:#fff;font-weight:700;font-size:12px;padding:2px 10px;border-radius:12px;z-index:2}
.dcard .db{padding:12px 14px;flex:1}
.dcard h3{font-size:16px;line-height:1.5}
.dcard .dm{font-size:13px;color:var(--muted);margin-top:4px}
.dcard .da{display:flex;gap:6px;padding:0 14px 14px;flex-wrap:wrap}
.newtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.newtiles button{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 10px;cursor:pointer;text-align:center;font-weight:800;font-family:"Noto Kufi Arabic",sans-serif;transition:border-color .15s,transform .15s}
.newtiles button:hover{transform:translateY(-2px);border-color:var(--tc)}
.newtiles button[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--surface))}
.newtiles .e{font-size:30px;display:block}
.newtiles small{display:block;font-family:"Noto Sans Arabic",sans-serif;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.modal .box.wide .pv-wrap{margin-top:4px}

/* ===== Paper (A4) ===== */
.paper{position:relative;width:210mm;min-height:297mm;background:#fff;color:#111;padding:13mm;font-family:"Noto Sans Arabic",Tahoma,sans-serif;font-size:11.5pt;line-height:1.62;box-shadow:0 10px 30px rgba(0,0,0,.18);text-align:start}
.paper::before{content:"";position:absolute;inset:6mm;border:1.4pt solid #3A4D14;border-radius:3mm;box-shadow:inset 0 0 0 1.1mm #fff,inset 0 0 0 1.45mm #C9A227;pointer-events:none}
.paper *{box-sizing:border-box}

.paper .pmeta div{padding:1mm 2.5mm 1.2mm;font-size:10.5pt;border-inline-start:1px solid #C9CFB5;background:#F7F8F2;line-height:1.5;font-weight:600}

.paper .ptitle{display:flex;align-items:center;justify-content:center;gap:3mm;margin:3mm 0 2.5mm;text-align:center;flex-wrap:wrap}

.paper .ptitle .stamp{border:2px solid #C62828;color:#C62828;font-family:"Noto Kufi Arabic",sans-serif;font-size:10pt;font-weight:700;padding:.3mm 3mm;border-radius:2mm;transform:rotate(-4deg)}
.paper .pstud{display:flex;gap:6mm;align-items:flex-end;margin-bottom:3mm}
.paper .sf{flex:1;display:flex;gap:2mm;align-items:baseline;font-size:11pt}

.paper .sf span{font-weight:700;color:#3A4D14;white-space:nowrap}
.paper .sf i{flex:1;border-bottom:1.3px dotted #444;height:1em}
.paper .sbox{display:inline-flex;flex-direction:column;border:1.5px solid var(--tc);border-radius:2mm;overflow:hidden;width:13mm;text-align:center;flex:none;background:#fff}
.paper .sbox i{display:block;height:7mm;background:#fff}
.paper .sbox b{display:block;background:var(--tc);color:#fff;font-size:10.5pt;line-height:1.55;font-weight:800}
.paper .tot{display:flex;flex-direction:column;align-items:center;gap:.8mm}
.paper .tot .tl{font-family:"Noto Kufi Arabic",sans-serif;font-size:8.5pt;font-weight:700;color:#3A4D14;white-space:nowrap}
.paper .tot .sbox{width:22mm;border-width:2px;border-radius:2.5mm}
.paper .tot .sbox i{height:9mm}
.paper .tot .sbox b{font-size:13pt}
.paper .pinst{border:1px dashed #C9A227;background:#FFFBEA;border-radius:2mm;padding:1.8mm 4mm;font-size:10.5pt;margin-bottom:2mm;line-height:1.7}
.paper .pinst b{color:#8A6D10}
.paper .pq{margin-top:4mm}
.paper .pqh{display:flex;align-items:stretch;border:1.4px solid var(--tc);border-radius:2.2mm;overflow:hidden;break-after:avoid;break-inside:avoid;background:#F4F6EC;min-height:9mm}
.paper .pqh .qno{display:flex;align-items:center;background:var(--tc);color:#fff;font-family:"Noto Kufi Arabic",sans-serif;font-weight:700;font-size:11pt;padding:0 3.5mm;white-space:nowrap}
.paper .pqh .pr{flex:1;display:flex;align-items:center;padding:1mm 3.5mm;font-weight:700;font-size:11pt;line-height:1.6;color:#111}
.paper .pqh .sbox{border:0;border-inline-start:1.4px solid var(--tc);border-radius:0;width:14mm}
.paper .pqh .sbox i{flex:1;min-height:5.5mm;height:auto}
.paper .pqh .sbox b{font-size:10.5pt;line-height:1.5}
.paper .pi{list-style:none;margin:1.5mm 0 0;padding:0 3mm}
.paper .pi>li{padding:.7mm 0;break-inside:avoid}
.paper .n{display:inline-block;min-width:5mm;font-weight:700;color:#3A4D14}
.paper .n::after{content:"."}
.paper .opts{display:grid;gap:.6mm 4mm;margin:.8mm 6mm 0}
.paper .opts.c4{grid-template-columns:repeat(4,1fr)}.paper .opts.c2{grid-template-columns:repeat(2,1fr)}.paper .opts.c1{grid-template-columns:1fr}
.paper .op b{display:inline-grid;place-items:center;width:5.6mm;height:5.6mm;border:1px solid #555;border-radius:50%;font-size:8.5pt;margin-inline-end:1.5mm;line-height:1}
.paper .op.ok{color:#1E7A36;font-weight:700}.paper .op.ok b{background:#1E7A36;color:#fff;border-color:#1E7A36}
.paper .par{display:inline-block;min-width:9mm;text-align:center;font-weight:700;color:#1E7A36}
.paper .bl{display:inline-block;min-width:22mm;border-bottom:1.3px dotted #333;margin:0 1mm;height:1.15em;vertical-align:baseline}
.paper .bl.k{color:#1E7A36;font-weight:700;border-bottom:1.5px solid #1E7A36;padding:0 2mm;min-width:0;height:auto}
.paper .lines div{border-bottom:1px dotted #888;height:7.5mm}
.paper .ans{color:#1E7A36;font-weight:700;margin:1mm 6mm 0;padding:.8mm 3mm;border-inline-start:3px solid #1E7A36;background:#EFF8F1;border-radius:1mm}
.paper .ws{border:1px solid #bbb;border-radius:2mm;margin:1.2mm 6mm 0;background-image:radial-gradient(#c3c3c3 .7px,transparent .9px);background-size:5mm 5mm}
.paper .ws-s{height:14mm}.paper .ws-m{height:24mm}.paper .ws-l{height:44mm}
.paper table.pt{width:calc(100% - 6mm);margin:2mm 3mm 0;border-collapse:collapse;font-size:11pt}
.paper .pt th,.paper .pt td{border:1px solid #3A4D14;padding:1.2mm 3mm;text-align:start;vertical-align:top}
.paper .pt th{background:#EEF1E4;text-align:center;font-family:"Noto Kufi Arabic",sans-serif;font-size:10pt}
.paper .pt.cls td{text-align:center;height:8.5mm}
.paper .kk{color:#1E7A36;font-weight:700}
.paper .bank{display:flex;flex-wrap:wrap;gap:1.5mm 2.5mm;align-items:center;border:1.2px solid #C9A227;border-radius:2mm;padding:1.8mm 3mm;margin:2mm 3mm 1mm;background:#FFFBEA}
.paper .bank b{color:#8A6D10;font-size:10pt}
.paper .bank span{border:1px solid #C9A227;border-radius:5mm;padding:0 3mm;background:#fff;font-size:10.5pt}
.paper .passage{border:1px solid #bbb;border-radius:2mm;padding:2.5mm 4mm;margin:2mm 3mm;background:#FAFAF6;line-height:2}
.paper .pimg{text-align:center;margin:2mm 0}
.paper .pimg img{max-width:100%;max-height:75mm;border:1px solid #ddd;border-radius:2mm}
.paper .noimg{display:inline-grid;place-items:center;width:60mm;height:35mm;border:1.5px dashed #aaa;border-radius:2mm;color:#888}
.paper .psec{margin-top:6mm;text-align:center;break-after:avoid;position:relative}
.paper .psec::before{content:"";position:absolute;inset-inline:0;top:50%;border-top:1.5px solid #C9A227}
.paper .psec span{position:relative;display:inline-block;background:#fff;padding:0 4mm;font-family:"Noto Kufi Arabic",sans-serif;font-weight:700;font-size:12.5pt;color:#1F2A0A}
.paper .pempty{text-align:center;color:#999;margin:15mm 0}
.paper .pend{margin:5mm 0 2.5mm;text-align:center;font-family:"Noto Kufi Arabic",sans-serif;font-weight:700;color:#3A4D14;font-size:11pt;break-inside:avoid;break-after:avoid}
.paper .pend::before,.paper .pend::after{content:"❖";color:#C9A227;margin:0 2.5mm}
.paper table.psig{width:100%;border-collapse:collapse;font-size:10.5pt;break-inside:avoid;text-align:center}
.paper .psig td{border:1px solid #9AA57A;padding:1.5mm 2mm;background:#FAFBF6}
.paper .psig b{display:block;color:#3A4D14;font-family:"Noto Kufi Arabic",sans-serif;font-size:9pt}
.paper .pbar{margin-top:4mm;padding-top:1.2mm;border-top:1.5px solid #3A4D14;display:flex;justify-content:space-between;gap:3mm;flex-wrap:wrap;font-size:8.5pt;color:#555;font-family:"Noto Kufi Arabic",sans-serif}
.paper .pbar .ok{color:#1E7A36;font-weight:700}
.paper .pbreak{position:absolute;left:4mm;right:4mm;border-top:2px dashed #7d8a5a;z-index:3;pointer-events:none}
.paper .pbreak span{position:absolute;top:-3.4mm;left:50%;transform:translateX(-50%);background:#EEF1E4;border:1px solid #7d8a5a;border-radius:4mm;padding:0 3mm;font-size:8pt;color:#3A4D14;font-family:"Noto Kufi Arabic",sans-serif;white-space:nowrap}
.paper .pbreak.over{border-top-color:#C62828}
.paper .pbreak.over span{background:#FDECEA;border-color:#C62828;color:#C62828}
.paper .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.88em;margin:0 .15em}
.paper .frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .25em}
.paper .ovl{border-top:1px solid currentColor;padding:0 .12em}
.paper .m{unicode-bidi:isolate;direction:ltr}
.paper sup,.paper sub{font-size:.7em;line-height:0}
/* ===== v4 UI ===== */
:root{--gold-ink:#7A5E00;--pv-bg:#D5D9C8}
:root[data-theme="dark"]{--gold-ink:#F0D77E;--pv-bg:#0A0D06}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold-ink:#F0D77E;--pv-bg:#0A0D06}}
.pill.warn,.note,.chipx.yr{color:var(--gold-ink)!important}
.pv-wrap{background:var(--pv-bg)}
.themebtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:3px 9px;cursor:pointer;font-size:15px;line-height:1.4}
.themebtn:hover{background:rgba(255,255,255,.2)}
.lg-top .themebtn{padding:6px 12px;border-radius:30px;border-color:rgba(227,195,90,.5)}
nav.main .badge{background:#E5484D;color:#fff;border-radius:10px;font-size:11.5px;padding:0 7px;margin-inline-start:6px;font-weight:800;position:static}
/* axes tabs */
.axes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0 4px}
.axis{position:relative;display:flex;gap:12px;align-items:center;text-align:start;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s;overflow:hidden;color:var(--ink)}
.axis::after{content:"";position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--ac);opacity:.35;transition:.2s}
.axis:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.axis[aria-selected="true"]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--surface));box-shadow:0 16px 30px -18px var(--ac)}
.axis[aria-selected="true"]::after{opacity:1;height:6px}
.axis .ai{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:29px;background:linear-gradient(140deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#fff));box-shadow:0 10px 20px -10px var(--ac);flex:none}
.axis[aria-selected="true"] .ai{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-5deg)}}
.axis .at{display:grid;gap:2px;min-width:0;flex:1}
.axis b{font-family:"Noto Kufi Arabic",sans-serif;font-size:14px;line-height:1.5}
.axis small{font-size:12.5px;color:var(--muted);font-weight:600}
.abar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.abar i{display:block;height:100%;width:0;background:var(--ac);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.axis-panel{margin-top:18px}
.axis-panel h2{font-size:21px}
.axis-panel h2::before{display:none}
.axis-panel h2 .hi{width:38px;height:38px;border-radius:12px;display:inline-grid;place-items:center;background:var(--c);font-size:20px}
@media (max-width:960px){.axes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.axes{gap:8px}.axis{padding:10px;gap:8px;flex-direction:column;align-items:flex-start}.axis .ai{width:44px;height:44px;font-size:23px}.axis b{font-size:13px}}
/* status & approval */
.stchip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:800;padding:2px 10px;border-radius:12px;white-space:nowrap;border:1.5px solid}
.st-draft{color:var(--muted);border-color:var(--line);background:var(--surface-2)}
.st-pend{color:var(--gold-ink);border-color:var(--gold);background:var(--gold-soft)}
.st-ok{color:var(--done);border-color:var(--done);background:color-mix(in srgb,var(--done) 12%,var(--surface))}
.st-ret{color:var(--danger);border-color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--surface))}
.bdstat{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.sendbtn{background:var(--g2);border-color:var(--g2)}
.okbtn{background:var(--done)!important;border-color:var(--done)!important}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:none}
#bdnote .msg{margin:0 0 14px}
.msg.warn{border-color:var(--gold);background:var(--gold-soft)}
.limitnote{font-size:13px;color:var(--muted);margin:-2px 0 10px;font-weight:600}
.pv-head .lim{font-size:12px;background:var(--surface-2);border-radius:10px;padding:1px 9px;margin-inline-start:6px}
.pv-head .lim.over{background:var(--danger);color:#fff}
#pvWarn .msg{margin:0 0 8px;font-size:13.5px}
.pvinfo{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin:-4px 0 10px;font-weight:600}
.dcard .dtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pendchip[aria-pressed="false"]{border-color:var(--gold);color:var(--gold-ink)}
/* accounts */
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cardhead h2{margin:0!important}
.pchips{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:12px;padding:1px 9px;border-radius:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink);display:inline-block}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perm{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:14px}
.perm:has(input:checked){border-color:var(--green-2);background:color-mix(in srgb,var(--green-2) 10%,var(--surface))}
.perm input{width:18px;height:18px;accent-color:var(--green-2)}
.perm .pi2{font-size:18px}
@media (max-width:620px){.permgrid{grid-template-columns:1fr}.modal .bgrid{grid-template-columns:1fr!important}}


:root{--btn-ink:#fff}
:root[data-theme="dark"]{--btn-ink:#10160A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--btn-ink:#10160A}}
.btn:not(.ghost):not(.danger):not(.gold),.seg button[aria-pressed="true"],.chip[aria-pressed="true"],.symtabs button[aria-pressed="true"],.mtabs button[aria-pressed="true"],.tseg.lang button[aria-pressed="true"],.up:hover,.count.ok,.chipx.ok,.badge.ok{color:var(--btn-ink)}
/* ===== Sheets (paginated A4) ===== */
.sheets{display:flex;flex-direction:column;gap:8mm;width:210mm}
.paper{height:297mm;min-height:0;overflow:hidden;padding:13mm 13mm 0}
.paper .pbody{height:262mm;overflow:hidden}
.paper .pfoot2{position:absolute;inset-inline:9.5mm;bottom:8.5mm;display:flex;justify-content:space-between;align-items:center;gap:3mm;border-top:1.3px solid #3A4D14;padding-top:1mm;font-family:"Noto Kufi Arabic",sans-serif;font-size:8pt;color:#555}
.paper .pfoot2 .pg{font-weight:700;color:#3A4D14}
.paper .pfoot2 .ok{color:#1E7A36;font-weight:700}
.paper.over::before{border-color:#C62828;box-shadow:inset 0 0 0 1.1mm #fff,inset 0 0 0 1.45mm #C62828}
.paper .overbadge{position:absolute;top:2mm;left:50%;transform:translateX(-50%);background:#C62828;color:#fff;font-family:"Noto Kufi Arabic",sans-serif;font-size:9pt;font-weight:700;padding:.5mm 4mm;border-radius:4mm;white-space:nowrap}
.meas-host{position:fixed;top:0;left:0;width:1px;height:1px;overflow:hidden;visibility:hidden;pointer-events:none;z-index:-1}
.paper.measure{height:auto;box-shadow:none}
.paper.measure .pbody{height:auto;overflow:visible}
.paper.measure::before{display:none}
.paper .pi{margin:0}
.paper .pqh{margin-bottom:1.5mm}
.paper .pimg img{height:60mm;width:auto;max-width:100%;max-height:none;object-fit:contain}
.paper .noimg{height:30mm}
.paper .pend{margin:5mm 0 2.5mm}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body{display:block!important;min-height:0!important}
  body::before{display:none!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  #print-root .sheets{display:block;width:auto;gap:0}
  #print-root .paper{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  #print-root .paper:last-child{break-after:auto;page-break-after:auto}
  #print-root .overbadge{display:none}
  .paper,.paper *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ===== vision/mission, circulars, bell ===== */
.vm{background:var(--surface);border-bottom:1px solid var(--line)}
.vm .wrap{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;padding-top:14px;padding-bottom:14px;align-items:stretch}
.vmc{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:12px 16px;border-inline-start:5px solid var(--gold)}
.vmc:nth-child(2){border-inline-start-color:var(--g2)}
.vmc .vi{font-size:26px;line-height:1.2}
.vmc b{font-family:"Noto Kufi Arabic",sans-serif;color:var(--green);font-size:15.5px}
.vmc p{margin:2px 0 0;font-size:15px;line-height:1.8}
.vmb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px solid var(--gold);background:var(--gold-soft);border-radius:14px;padding:10px 16px;cursor:pointer;font-size:28px;color:var(--ink);min-width:140px;transition:transform .2s}
.vmb span{font-family:"Noto Kufi Arabic",sans-serif;font-weight:700;font-size:13.5px}
.vmb:hover{transform:translateY(-2px)}
@media (max-width:860px){.vm .wrap{grid-template-columns:1fr}.vmb{flex-direction:row;font-size:22px}}
.bell{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:3px 9px;cursor:pointer;font-size:15px;line-height:1.4}
.bell .bdg{position:absolute;top:-8px;inset-inline-end:-8px;background:#E5484D;color:#fff;border-radius:10px;font-size:11px;min-width:19px;height:19px;display:grid;place-items:center;font-weight:800;padding:0 4px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.npanel{position:fixed;inset-inline-end:max(12px,calc((100vw - 1180px)/2 + 20px));width:min(390px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:45;animation:pop .2s ease-out}
.npanel h3{padding:12px 16px;border-bottom:1px solid var(--line);font-size:16px;color:var(--green);position:sticky;top:0;background:var(--surface)}
.npanel a{display:flex;gap:10px;padding:10px 16px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);align-items:flex-start}
.npanel a:hover{background:var(--surface-2)}
.npanel a.new{background:color-mix(in srgb,var(--gold) 13%,var(--surface))}
.npanel .ni{font-size:20px;line-height:1.3}
.npanel b{display:block;font-size:14px;line-height:1.5}
.npanel small{display:block;color:var(--muted);font-size:12.5px}
.npanel .empty{padding:26px}
.newb{display:inline-block;background:#E5484D;color:#fff!important;font-size:11.5px;font-weight:800;padding:0 8px;border-radius:10px;font-family:"Noto Sans Arabic",sans-serif}
.circ{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--gold);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 8px 24px -18px rgba(31,42,10,.35)}
.circ.new{border-inline-start-color:#E5484D}
.circ h3{font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink)}
.circ .meta{font-size:13px;color:var(--muted);margin-top:2px}
.circ .txt{white-space:pre-line;margin:10px 0;line-height:1.85}
.cbanner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,#E5484D 9%,var(--surface));border:1.5px solid #E5484D;border-radius:14px;padding:10px 14px;margin:16px 0 0;font-weight:700;text-decoration:none;color:var(--ink)}
.cbanner .go{margin-inline-start:auto;color:#E5484D}
/* ===== v5: server mode, review, evaluation, reports ===== */
:root{--g5:#2457C5}
:root[data-theme="dark"]{--g5:#7EA6FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g5:#7EA6FF}}
html.busy::after{content:"";position:fixed;top:0;inset-inline:0;height:3px;z-index:100;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:50% 100%;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-50% 0}to{background-position:150% 0}}
.boot{min-height:70vh;display:grid;place-items:center;align-content:center;gap:14px;color:var(--muted);font-weight:700}
.boot img{width:110px;background:#fff;border-radius:18px;padding:10px;animation:pulse 1.6s ease-in-out infinite}
.demobar{background:var(--gold-soft);color:var(--gold-ink);text-align:center;font-size:13px;font-weight:700;padding:4px 10px;border-bottom:1px solid var(--gold)}
.who .nm small{display:block;font-size:11px;opacity:.75;line-height:1.2}
.files .th.img{background:#2457C5;font-size:15px}
.fs-pend{color:var(--gold-ink)}.fs-ok{color:var(--done)}.fs-rej{color:var(--danger)}
.files li.fst-rejected{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:color-mix(in srgb,var(--danger) 6%,var(--surface))}
.files li.fst-accepted{border-color:color-mix(in srgb,var(--done) 40%,var(--line))}
.files .rnote{color:var(--danger)!important;white-space:normal}
.files .x.ok{color:var(--done);font-size:16px;border:1px solid color-mix(in srgb,var(--done) 40%,transparent)}
.files .x.ok:hover{background:var(--done);color:#fff}
.files .x.no{color:var(--danger);font-size:15px;border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.files .x.no:hover{background:var(--danger);color:#fff}
.lockmsg{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,var(--surface));font-weight:700;margin:16px 0 0}
.band-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lightbtn{background:rgba(255,255,255,.14)!important;border-color:rgba(255,255,255,.5)!important;color:#fff!important}
.axes.ax5{grid-template-columns:repeat(5,minmax(0,1fr))}
.axes.ax5 .axis .ai{width:48px;height:48px;font-size:25px}
.axes.ax5 .axis b{font-size:13px}
@media (max-width:1100px){.axes.ax5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.axes.ax5{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* progress card */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:18px;box-shadow:0 10px 26px -20px rgba(31,42,10,.4)}
.pc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pc-h h2{font-size:17px;color:var(--green)}
.evbadge{display:inline-flex;gap:6px;align-items:center;padding:6px 14px;border-radius:30px;background:linear-gradient(120deg,var(--gold),var(--gold-2));color:#1F2A0A;font-weight:700;text-decoration:none;font-size:14px}
.evbadge.draft{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.evbadge.none{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:13px}
.pc-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:center}
.pc-bars{display:grid;gap:8px}
.pcb{display:grid;grid-template-columns:minmax(120px,240px) 1fr 44px;gap:10px;align-items:center;font-size:13.5px;font-weight:600}
.pcb .fill i{background:var(--ac)}
.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.pc-stats div{border-radius:14px;padding:10px 6px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface-2)}
.pc-stats b{display:block;font-size:24px;font-family:"Noto Kufi Arabic",sans-serif}
.pc-stats .ok b{color:var(--done)}.pc-stats .pend b{color:var(--gold-ink)}.pc-stats .rej b{color:var(--danger)}

.rate-view{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.rate-view .rv{color:var(--gold);font-size:20px;letter-spacing:2px}
.rate-view small{color:var(--muted)}.muted{color:var(--muted)}
.tev{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:2px 10px;display:inline-block}
.tev.ok{background:var(--gold-soft);color:var(--gold-ink)}
/* review */
.chips .sep{width:1px;background:var(--line);margin:0 6px}
.rvg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.rvh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rvh h3{font-size:16px;margin-inline-end:auto}.rvh h3 small{color:var(--muted);font-weight:500;font-size:13px}
.rvfiles li.rvrow{display:grid;grid-template-columns:minmax(160px,1fr) auto minmax(0,1.6fr) auto auto auto;align-items:center}
.rvitem{display:grid;font-size:13px;min-width:0}.rvitem small{color:var(--muted)}
@media (max-width:760px){.rvfiles li.rvrow{grid-template-columns:auto 1fr auto auto}.rvitem{grid-column:1/-1}}
/* evaluation table & form */
.evt td,.evt th{text-align:center}.evt td:nth-child(2),.evt th:nth-child(2){text-align:start}
.fill.sm{width:60px;display:inline-block;vertical-align:middle}
.evwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start;padding-top:20px;padding-bottom:40px}
.evmain>.msg{margin-bottom:14px}
.evd{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--c,var(--green-2));border-radius:16px;padding:14px 16px;margin-bottom:14px}
.evdh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.evdh .hi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--c,var(--gold));font-size:20px}
.evdh h2{font-size:17px;flex:1}
.dscore{font-size:13px;color:var(--muted)}.dscore b{font-size:20px;color:var(--ink);font-family:"Noto Kufi Arabic",sans-serif}
.evi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.evq{display:grid;gap:2px}.evq b{font-size:14.5px}
.evs{font-size:12px;color:var(--muted);font-weight:600}.evs.ok{color:var(--done)}
.rates{display:flex;gap:4px}
.rt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:3px 8px;cursor:pointer;display:grid;justify-items:center;min-width:56px;color:var(--ink)}
.rt b{font-size:16px;font-family:"Noto Kufi Arabic",sans-serif;line-height:1.3}.rt small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.rt:hover:not(:disabled){border-color:var(--c,var(--green-2))}
.rt[aria-checked="true"]{background:var(--c,var(--green-2));border-color:var(--c,var(--green-2));color:#fff}.rt[aria-checked="true"] small{color:#fff}
.rt:disabled{cursor:default;opacity:.75}
.evside{position:sticky;top:calc(var(--hh,80px) + 12px)}
.evsum{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);text-align:center}
.evtot b{font-size:44px;font-family:"Noto Kufi Arabic",sans-serif;color:var(--green);line-height:1.2}.evtot small{display:block;color:var(--muted)}
.evgrade{font-family:"Noto Kufi Arabic",sans-serif;font-weight:700;font-size:18px;color:var(--gold-ink);margin:2px 0 10px;min-height:1.5em}
#evbars{display:grid;gap:6px;margin-bottom:10px;text-align:start}#evbars .pcb{grid-template-columns:58px 1fr 34px;font-size:12.5px}
@media (max-width:980px){.evwrap{grid-template-columns:1fr}.evside{position:static;order:-1}.evi{grid-template-columns:1fr}.rates{flex-wrap:wrap}}
/* periods */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:14px}
.pcardx.open{border-inline-start:6px solid var(--done)}.pcardx.closed{border-inline-start:6px solid var(--danger)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span{width:46px;height:26px;border-radius:20px;background:var(--line);position:relative;transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--done)}.switch input:checked+span::after{inset-inline-start:23px}
.switch input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:760px){.pgrid{grid-template-columns:1fr}}
/* printed tables & report */
.paper table.ptab{width:100%;border-collapse:collapse;font-size:10pt;margin-top:3mm;text-align:center}
.paper .ptab th{background:#3A4D14;color:#fff;font-family:"Noto Kufi Arabic",sans-serif;font-weight:700;padding:1.4mm 1.5mm;font-size:9pt;border:1px solid #3A4D14}
.paper .ptab td{border:1px solid #C9CFB5;padding:1.2mm 1.5mm}
.paper .ptab tbody tr:nth-child(even) td{background:#F7F8F2}
.paper .ptab td:nth-child(2){text-align:start}
.paper .plegend{font-size:8.5pt;color:#555;margin:2mm 0 4mm}
.paper .rsum{display:flex;gap:8mm;align-items:center;justify-content:center;margin:5mm 0 2mm}
.paper .rring{--p:0;width:34mm;height:34mm;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#3A4D14 calc(var(--p)*1%),#E5E9D8 0)}
.paper .rring div{width:26mm;height:26mm;border-radius:50%;background:#fff;display:grid;place-items:center;align-content:center}
.paper .rring b{font-family:"Noto Kufi Arabic",sans-serif;font-size:17pt;color:#1F2A0A;line-height:1.1}.paper .rring small{font-size:8pt;color:#666}
.paper .rgrade{display:grid;gap:1mm}.paper .rgrade small{color:#666;font-size:9pt}
.paper .rgrade>b{font-family:"Noto Kufi Arabic",sans-serif;font-size:20pt;color:#8A6D10;line-height:1.3}.paper .rgrade span{font-size:10pt}
.paper .rdom td:first-child{text-align:start}.paper .rdom td:nth-child(2){text-align:center}
.paper .rbar{display:block;height:3mm;background:#E5E9D8;border-radius:2mm;overflow:hidden}.paper .rbar i{display:block;height:100%;background:linear-gradient(90deg,#C9A227,#3A4D14)}
.paper .rtot td{background:#EEF1E4!important;font-weight:800;font-family:"Noto Kufi Arabic",sans-serif}
.paper .r5 td:first-child{text-align:start}.paper .r5 td:last-child{color:#8A6D10;font-weight:700;white-space:nowrap}
.paper .rnotes{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;margin-top:3.5mm}
.paper .rnotes div{border:1px solid #C9CFB5;border-radius:2mm;padding:2mm 3mm;background:#FAFBF6;min-height:20mm;font-size:9.5pt}
.paper .rnotes b{display:block;color:#3A4D14;font-family:"Noto Kufi Arabic",sans-serif;font-size:9.5pt}
.paper .rnotes p{margin:1mm 0 0;white-space:pre-line;line-height:1.6}
.paper .rappr{font-size:9.5pt;color:#1E7A36;font-weight:700;text-align:center;margin:3mm 0 2mm}

.bd-prev{top:calc(var(--hh,80px) + 8px)!important}.symbar{top:calc(var(--hh,80px) + 4px)!important}
@media (max-width:620px){.symbar{position:static}}
.paper.rpt{font-size:10.5pt}
.paper.rpt .ph-logo img{width:19mm}
.paper.rpt .ph-ar,.paper.rpt .ph-en{font-size:8pt;line-height:1.55}
.paper.rpt .ptitle{margin:2.5mm 0 2mm}.paper.rpt .ptitle h1{font-size:14pt}
.paper.rpt .pmeta div{padding:.8mm 2mm;font-size:9.5pt}
.paper.rpt .rsum{margin:3mm 0 1mm;gap:6mm}
.paper.rpt .rring{width:27mm;height:27mm}.paper.rpt .rring div{width:21mm;height:21mm}.paper.rpt .rring b{font-size:14pt}
.paper.rpt .rgrade>b{font-size:16pt}
.paper.rpt .ptab{font-size:9pt;margin-top:2.5mm}.paper.rpt .ptab th{padding:1mm;font-size:8.5pt;white-space:nowrap}.paper.rpt .ptab td{padding:.7mm 1.5mm;line-height:1.45}
.paper.rpt .rdom td:nth-child(3){white-space:nowrap}
.paper.rpt .rdom td:first-child{width:44%}
.paper.rpt .r5 tbody{display:grid;grid-template-columns:1fr 1fr}

.paper.rpt .r5 caption{caption-side:top;background:#3A4D14;color:#fff;font-family:"Noto Kufi Arabic",sans-serif;font-size:8.5pt;padding:.8mm;font-weight:700}
.paper.rpt .rnotes{margin-top:2.5mm;gap:2.5mm}.paper.rpt .rnotes div{min-height:15mm;padding:1.5mm 2.5mm;font-size:9pt}
.paper.rpt .rappr{margin:2mm 0 1.5mm;font-size:9pt}
.paper.rpt .psig td{padding:1mm 2mm;font-size:9pt}
/* inline rating beside evidence */
.irate{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:12px;background:color-mix(in srgb,var(--gold) 6%,var(--surface))}
.irate.set{border-style:solid;border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.irate.saving{opacity:.6;pointer-events:none}
.irate .irl{font-weight:700;font-size:14px;color:var(--ink)}.irate .sg{font-weight:500;color:var(--muted);font-size:12px;margin-inline-start:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.irb{display:flex;gap:4px;flex-wrap:wrap}
.ir{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:3px 8px;cursor:pointer;display:grid;justify-items:center;min-width:60px;color:var(--ink);font:inherit}
.ir b{font-size:15px;font-family:"Noto Kufi Arabic",sans-serif;line-height:1.3}.ir small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.ir:hover:not(:disabled){border-color:var(--c,var(--green-2));transform:translateY(-1px)}

.ir:disabled{cursor:default;opacity:.7}
.irate.ro{justify-content:flex-start}.irate.ro .rv{color:var(--gold);font-size:18px;letter-spacing:2px}.irate.ro small{color:var(--muted)}

async function localCall(req){
  LocalDB.load();
  if(!LocalDB.data.seeded){CORE.seed({db:LocalDB,now:()=>Date.now(),uuid:uid2});LocalDB.data.seeded=1;LocalDB.flush()}
  let pre=null;
  if(req.action==="upload"&&req.data){pre="b"+uid2();await IDB.put(pre,{type:req.type,b64:req.data})}
  const ctx={db:LocalDB,now:()=>Date.now(),uuid:uid2,saveBlob:()=>pre,log:()=>{},sheetUrl:""};
  let res;
  try{res=CORE.handle(JSON.parse(JSON.stringify(req)),ctx)}
  catch(e){if(pre)try{await IDB.del(pre)}catch(_){}LocalDB.data=null;return {ok:false,error:e.user?e.message:("خطأ: "+e.message)}}
  if(res._readRef){const r=await IDB.get(res._readRef);res.data=r?r.b64:"";delete res._readRef}
  for(const ref of [res._deleteRef,...(res._deleteRefs||[])].filter(Boolean)){try{await IDB.del(ref)}catch(_){}}
  delete res._deleteRef;delete res._deleteRefs;
  try{LocalDB.flush()}catch(e){LocalDB.data=null;return {ok:false,error:"مساحة المتصفح ممتلئة."}}
  return JSON.parse(JSON.stringify(res));
}

}

function applyPatch(r){
  (r.put||[]).forEach(({k,v})=>{
    if(k==="school"){DB.school=v;return}if(k==="settings"){DB.settings=v;return}
    if(k==="me"){Object.assign(DB.me,v);return}
    const arr=DB[KMAP[k]];if(!arr)return;const i=arr.findIndex(x=>String(x.id)===String(v.id));if(i>=0)arr[i]=v;else arr.push(v);
    if(DB.me&&((k==="teacher"&&DB.me.kind==="teacher")||(k==="staff"&&DB.me.kind==="staff"))&&String(DB.me.id)===String(v.id))Object.assign(DB.me,v);

async function api(action,payload={},opt={}){
  const req=Object.assign({action,token:TOKEN},payload);let res;
  if(!opt.quiet)setBusy(1);
  try{res=REMOTE?await remoteCall(req):await localCall(req)}
  catch(e){throw new Error(REMOTE?"تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم حاول مجددًا.":"تعذّر تنفيذ العملية.")}
  finally{if(!opt.quiet)setBusy(-1)}
  if(!res||!res.ok){const msg=(res&&res.error)||"حدث خطأ غير متوقع";
    if(/انتهت الجلسة|موقوف/.test(msg)&&action!=="login"){clearLogin();toast(msg);render()}
    throw new Error(msg)}
  if(res.put||res.del)applyPatch(res);
  return res;
}

async function drawImage(file,max){
  const url=URL.createObjectURL(file);
  try{const img=new Image();img.src=url;await img.decode();
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c}
  finally{URL.revokeObjectURL(url)}
}
const isImgFile=f=>/^image\/(jpeg|jpg|png|webp)$/i.test(f.type)||/\.(jpe?g|png|webp)$/i.test(f.name);
const isPdfFile=f=>f.type==="application/pdf"||/\.pdf$/i.test(f.name);
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(b)});
const maxKB=()=>+(DB.settings&&DB.settings.maxKB)||15;

/* shrink an image until it fits the byte limit (quality first, then dimensions) */
async function compressTo(file,limit){
  const url=URL.createObjectURL(file);let img;
  try{img=new Image();img.src=url;await img.decode()}finally{URL.revokeObjectURL(url)}
  const W=img.naturalWidth,H=img.naturalHeight;let max=Math.min(1600,Math.max(W,H)),q=.72;
  for(let i=0;i<80&&max>=240;i++){
    const s=max/Math.max(W,H),c=document.createElement("canvas");c.width=Math.max(1,Math.round(W*s));c.height=Math.max(1,Math.round(H*s));
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    const b=await toBlob(c,q);if(b&&b.size<=limit)return b;
    if(q>.42)q=Math.round((q-.1)*100)/100;else{max=Math.round(max*.82);q=.62}
  }
  return null;
}
async function prepareFile(file,limit){
  const kb=n=>Math.ceil(n/1024);
  if(isPdfFile(file)){
    if(limit&&file.size>limit)throw new Error(`ملف PDF «${file.name}» حجمه ${kb(file.size)} ك.ب، والحد المسموح ${kb(limit)} ك.ب. اضغط الملف أو ارفع صورة منه (تُضغط الصور تلقائيًا).`);
    if(file.size>MAX_MB*1048576)throw new Error(`حجم «${file.name}» أكبر من ${MAX_MB} م.ب`);return{blob:file,type:"application/pdf",name:file.name}}
  if(!isImgFile(file))throw new Error(`«${file.name}» ليس PDF أو صورة JPG/PNG`);
  const jpgName=file.name.replace(/\.(png|webp|jpeg|jpg)$/i,"")+".jpg";
  if(limit){
    if(file.size<=limit&&/jpe?g/i.test(file.type))return{blob:file,type:"image/jpeg",name:file.name};
    let b;try{b=await compressTo(file,limit)}catch(e){throw new Error(`تعذّر قراءة الصورة «${file.name}»`)}
    if(!b)throw new Error(`تعذّر ضغط الصورة «${file.name}» إلى ${kb(limit)} ك.ب. اقتطع الجزء المهم منها ثم أعد رفعها.`);
    return{blob:b,type:"image/jpeg",name:jpgName};
  }
  let big;try{big=await drawImage(file,1800)}catch(e){throw new Error(`تعذّر قراءة الصورة «${file.name}»`)}
  const jpg=await toBlob(big,.85);
  const blob=jpg&&jpg.size<file.size?jpg:file;
  if(blob.size>MAX_MB*1048576)throw new Error(`حجم «${file.name}» أكبر من ${MAX_MB} م.ب`);
  return{blob,type:blob.type||"image/jpeg",name:blob===jpg?jpgName:file.name};
}
async function storeFiles(list,meta){
  const errs=[],added=[],limit=isEvidence(meta)?maxKB()*1024:0;
  for(const file of list){
    try{const p=await prepareFile(file,limit);
      const r=await api("upload",{item:meta.item,slot:meta.slot,term:meta.term,name:p.name,type:p.type,size:p.blob.size,data:await blobToB64(p.blob)});
      added.push(r.put[0].v)}
    catch(e){errs.push(e.message||"تعذّر رفع الملف")}
  }
  return{n:added.length,added,errs};
}

function bindSlot(slot,meta,canEdit,refreshFn){
  slot.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>viewFile(b.dataset.view));
  slot.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(await deleteFile(b.dataset.del))refreshFn()});
  slot.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>reviewFile(b.dataset.acc,"accepted",refreshFn));
  slot.querySelectorAll("[data-rej]").forEach(b=>b.onclick=()=>reviewFile(b.dataset.rej,"rejected",refreshFn));
  if(!canEdit)return;
  const run=async list=>{if(!list.length)return;slot.classList.add("busy");const lab=slot.querySelector(".up span");if(lab)lab.textContent="جارٍ الرفع…";
    const {n,errs}=await storeFiles([...list],meta);slot.classList.remove("busy");
    if(errs.length)toast("⚠️ "+errs[0]);else if(n)toast(n>1?`✅ تم رفع ${n} ملفات`:"✅ تم رفع الملف — بانتظار مراجعة الإدارة");refreshFn(true)};
  const inp=slot.querySelector("input[type=file]");if(inp)inp.onchange=()=>run(inp.files);
  slot.querySelector("[data-link]")?.addEventListener("click",()=>addLinkDialog(meta,()=>refreshFn(true)));
  slot.addEventListener("dragover",e=>{e.preventDefault();slot.classList.add("drag")});
  slot.addEventListener("dragleave",e=>{if(!slot.contains(e.relatedTarget))slot.classList.remove("drag")});
  slot.addEventListener("drop",e=>{e.preventDefault();slot.classList.remove("drag");run(e.dataTransfer.files)});
}

function confetti(){if(reduced)return;const cs=["#55701F","#C9A227","#0F7C76","#E3C35A","#6A3FA0","#7FA046"];
  for(let i=0;i<80;i++){const c=document.createElement("i");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=cs[i%cs.length];
    c.style.animationDuration=(1.8+Math.random()*1.6)+"s";c.style.animationDelay=(Math.random()*.4)+"s";document.body.append(c);setTimeout(()=>c.remove(),4200)}}
function countUp(){root.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,suf=el.dataset.suf||"";
  if(reduced||!to){el.textContent=to+suf;return}const t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)))+suf;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
